# =============================================================================
# a2-gate.yml — A2 RHS snapshot bitwise + CVODE 15-key + 48/48 golden gate
# =============================================================================
# Spec:
#   - openspec/changes/s2-strict-omp-full/specs/strict-omp-acceptance-gates/spec.md
#     ADDED Requirement 2 (A2 RHS snapshot bitwise enforced at every P1-P6 sub-stage)
#     ADDED Requirement 5 (CVODE canonical 15-key set byte-equal at every sub-stage)
#     ADDED Requirement 6 (Snapshot golden 48/48 PASS for full snapshot suite)
# Issue: #101 task 9.2 + 9.7 (acceptance-gates cross-cutting).
#
# SCOPE:
#   Per-PR standing A2 gate that runs on every PR to baseline/current. Validates:
#     1. 48/48 snapshot golden SHA256 matrix (build_manifest.md 24 +
#        repeatability_snapshots*.txt 24) -- data-INDEPENDENT, runs always.
#     2. cvode_stats_diff selftest -- helper-script regression detection.
#     3. check_goldens selftest contract -- if check_goldens.sh reports a
#        non-zero exit, fail the gate.
#
# Per-PR sub-stage A2 RHS snapshot bitwise (against the per-PR sub-stage
# influenced arrays per spec Requirement 2 Scenario "Per-sub-stage A2
# snapshot golden PASS") is exercised at the SHUD source level on the
# server-side validation runs (`tools/server_validation/run_s1_bitwise.sbatch`
# and the per-sub-stage operator runs). This workflow is the standing
# data-INDEPENDENT mirror — verifying the golden infrastructure itself
# remains intact + the helper tools don't regress.
#
# GRACEFUL-SKIP CONTRACT:
#   If `docs/build_manifest.md` or any `benchmarks/<case>/B0_output/*.bin`
#   golden is absent (early-bootstrap state, not currently possible since
#   B0/B1a are tagged), this workflow emits a WARNING annotation and
#   SKIPs rather than failing -- matching the #101 task 9.2 contract
#   "the gate MUST NOT block on missing artifacts; if a golden file
#   doesn't exist yet (early P-sub-stage), the gate should SKIP gracefully
#   with a warning, not fail."
#
# This is distinct from serial-baseline.yml (which gates build + grep +
# invariant-sweep). a2-gate.yml is a dedicated gate dedicated to the A2 /
# 15-key / 48/48 contract so failures map cleanly to spec Requirements
# 2 + 5 + 6.
# =============================================================================

name: a2-gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - baseline/current
    types: [opened, reopened, synchronize]

concurrency:
  group: a2-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repo with SHUD submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # -----------------------------------------------------------------------
      # B1a-tag reachability smoke (spec Requirement 1 + status_matrix.md
      # S2 strict baseline policy)
      # -----------------------------------------------------------------------
      # P1-P7 sub-stage bitwise comparisons reference B1a-tag (commit
      # 64569b3); fail-fast if checkout shallow-omitted the tag so a
      # downstream `git show B1a-tag:...` does not silently return empty.
      - name: B1a-tag reachability smoke
        run: |
          if ! git rev-parse B1a-tag^{commit} >/dev/null 2>&1; then
            echo "::error title=B1a-tag missing or unreachable::cannot anchor S2 strict baseline; ensure actions/checkout fetch-tags: true (spec strict-omp-acceptance-gates Req 1; status_matrix.md L94-L97)."
            exit 1
          fi
          echo "B1a-tag reachable: $(git rev-parse B1a-tag^{commit})"

      # -----------------------------------------------------------------------
      # Graceful-skip preflight: required files must exist
      # -----------------------------------------------------------------------
      # If docs/build_manifest.md or any of the 4-case B0_output dirs is
      # absent (early bootstrap; not possible post-B0/B1a-tag), emit a
      # warning + skip the gate. Task 9.2 contract "MUST NOT block on
      # missing artifacts; SKIP gracefully with a warning".
      - name: Graceful-skip preflight (artifact presence)
        id: preflight
        run: |
          missing=0
          if [ ! -f docs/build_manifest.md ]; then
            echo "::warning title=A2 gate SKIP::docs/build_manifest.md absent — golden manifest not bootstrapped yet."
            missing=1
          fi
          for c in keliya xinanjiang_upstream qinyijiang qhh; do
            if [ ! -d "benchmarks/$c/B0_output" ]; then
              echo "::warning title=A2 gate SKIP::benchmarks/$c/B0_output absent — golden snapshots not bootstrapped yet."
              missing=1
            fi
          done
          echo "skip=$missing" >> "$GITHUB_OUTPUT"
          if [ "$missing" = "1" ]; then
            echo "::notice title=A2 gate skipped::missing artifacts — workflow exits success without enforcement. This is the bootstrap path; once goldens are populated the gate enforces 48/48 + 15-key matrix."
          fi

      # -----------------------------------------------------------------------
      # cvode_stats_diff selftest (helper regression detector)
      # -----------------------------------------------------------------------
      - name: cvode_stats_diff selftest
        if: steps.preflight.outputs.skip != '1'
        run: bash tools/cvode_stats_diff/test_cvode_stats_diff.sh

      # -----------------------------------------------------------------------
      # 48/48 snapshot golden matrix verification (Req 6 + task 9.7)
      # -----------------------------------------------------------------------
      # check_goldens.sh validates:
      #   - 24 SHA256 rows from docs/build_manifest.md (after-PassValue 12 +
      #     before-PassValue 12)
      #   - 24 unique-bin SHAs from 4 cases x 3 t-values x 2 sides
      #     (before-PassValue repeatability + after-PassValue repeatability)
      # Total = 48 entries; gate fails if any [MISMATCH] / [MISSING].
      - name: A2 snapshot 48/48 golden matrix
        if: steps.preflight.outputs.skip != '1'
        run: bash tools/check_goldens/check_goldens.sh

      # -----------------------------------------------------------------------
      # Failure artifact upload
      # -----------------------------------------------------------------------
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a2-gate-failure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            docs/build_manifest.md
            tools/check_goldens/check_goldens.sh
            tools/cvode_stats_diff/cvode_stats_diff.sh
