# =============================================================================
# serial-baseline.yml — SHUD-OpenMP S0-9 + S1-ci-A CI gate
# =============================================================================
# Spec:
#   - S0  ci-serial-baseline:   openspec/changes/s0-baseline-lock/specs/ci-serial-baseline/spec.md
#   - S1  b0-tag-ci-integration: openspec/changes/s1-rhs-core-extraction/specs/b0-tag-ci-integration/spec.md
# Issues: openmp #13 (S0-9 initial) → #50 (S1-ci-A: matrix + grep gates + nightly)
#         → #152 (PR-8 S2 capstone: collapse axis + retire LEGACY paths)
#
# S2 capstone scope (issue #152 / PR-8):
#   - Collapse 2-axis matrix (rhs_path × case) to 1-axis (case only). The
#     legacy `_omp` RHS receivers (MD_f_omp.cpp) and the legacy-vs-rhs_core
#     fork are deleted from SHUD source; there is no longer a second axis
#     to vary.
#   - Add `S2 capstone grep gate` step: MD_f_omp.cpp absent + the 3 `_omp`
#     RHS receiver function names produce 0 hits tree-wide + the legacy
#     gating macros produce 0 hits in src/ + Makefile.
#
# S1-ci-A scope (issue #50; retained):
#   - PR fast-feedback path: 1 case (keliya) = 1 job
#   - Nightly cron + PR `full-bitwise` label: 4 cases = 4 jobs
#   - Macro removal grep gates (USE_RHS_CORE / _OPENMP_ON / NV_DATA_OMP /
#     NV_DATA_S in f.cpp / N_VDestroy_Serial) — runs unconditionally even
#     without forcing data
#   - 90-day truncation: explicit END = START + 90 rewrite in the CI step
#     (tools/fix_case_paths/fix_case_paths.sh does NOT touch END; see note
#     in "Fix case paths" step below)
#
# S1-ci-B scope (issue #51) — LANDED on top of #50:
#   - fetch-tags: true + fetch-depth: 0 on actions/checkout (spec L71-76)
#   - B0-tag reachability smoke check immediately after checkout (spec L65-69)
#   - CVODE 15-key stats diff per (case, axis) via cvode_stats_diff.sh (spec L251-274)
#   - snapshot t_values HARD-fail gate (4 in-matrix cases; spec L102-108)
#   - on.pull_request.types extended to include labeled/unlabeled (spec L206-211)
#   - skip-baseline-ci label deletion verified at runtime (spec L170-174)
#
# Note: switching the SHA256 golden source from worktree
# (benchmarks/<case>/B0_output/) to `git show B0-tag:...` (spec L54-56) is
# tracked in a follow-up issue; the bitwise check is functionally equivalent
# today because PRs that touch B0_output also trigger the check_goldens
# manifest verifier (step 11) which catches worktree drift.
#
# -----------------------------------------------------------------------------
# Data strategy: STRATEGY C  (skip-label-only + scaffolded run-and-compare)
# -----------------------------------------------------------------------------
# NWM forcing (SHUD/Basins/<case>/forcing/, 30 MB to multi-GB) is local-only:
#   - SHUD submodule .git/info/exclude carries `/Basins/`
#   - SHUD/.gitignore line 13 (`forcing`) matches recursively
# Neither tree ships in the SHUD git history, so a CI runner has no path to
# the forcing CSVs (or the 90-day-truncated cfg.para) without external data.
#
# Strategy C is the lowest-scope-creep option:
#   - The build, grep-gate, and tool selftest steps are data-INDEPENDENT and
#     ALWAYS run (only gated by skip-label).
#   - The run + compare steps are SCAFFOLDED, gated by a per-case data probe;
#     when data is missing those steps log `data not deployed` notice and the
#     job exits success-with-warning (so it does not green-light bad code; it
#     simply documents that bitwise compare was skipped). When data is added
#     later, the same scaffolded steps light up without further changes.
#
# Strategy A/B trade-offs are unchanged from the S0-9 header; the rationale
# carries over to S1-ci-A (matrix expansion does not change the data story).
#
# -----------------------------------------------------------------------------
# Removing the skip-label at B0-tag time (deferred to #51):
# -----------------------------------------------------------------------------
# When B0-tag is cut and S0 ships, branch protection on main / baseline/current
# MUST mark `serial-baseline / build-and-compare` as a required check, and
# the `skip-baseline-ci` label MUST be deleted from the repo (so PRs cannot
# set it). Per the S0-9 spec scenario, deleting the label org-side is
# sufficient; the `if:` branch below evaluates trivially false once no PR
# can apply the label. Removal of the early-exit branch itself is tracked
# in #51.
# =============================================================================

name: serial-baseline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - baseline/current
    # S1-ci-B (#51): include labeled/unlabeled so add/remove of `full-bitwise`
    # label re-triggers the workflow (spec b0-tag-ci-integration L206-211
    # "标签即开关" — without labeled/unlabeled, switching label requires a
    # fresh push to actually swap fast-feedback / full-bitwise modes).
    types: [opened, reopened, synchronize, labeled, unlabeled]
  # S1-ci-A (#50) / S2 capstone (#152): nightly cron triggers the 4-job
  # full-bitwise matrix (4 cases, single axis post-PR-8 collapse). Per
  # b0-tag-ci-integration spec L213-218 "nightly cron 03:00 UTC 跑全 4 case",
  # the schedule runs on the default branch HEAD (GitHub Actions cron always
  # runs on the default branch, which is `main` here; nightly verifies
  # whatever was last merged into main).
  schedule:
    - cron: '0 3 * * *'

# Cancel superseded runs on the same ref so PR push spam does not pile up
# in the queue. Each push to a PR cancels the previous in-flight job.
# Scheduled runs do not collide with PR refs so cron jobs survive.
concurrency:
  group: serial-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — setup: emit the build matrix JSON
  # ---------------------------------------------------------------------------
  # S2 capstone (PR-8 #152): the 2-axis matrix (rhs_path × case) has been
  # collapsed to 1-axis (case only). The legacy `_omp` RHS receivers are
  # deleted and the legacy-vs-rhs_core fork is retired; no second axis.
  # Original "PR fast-feedback 路径只跑 keliya" (b0-tag-ci-integration
  # spec L36-52) intent is preserved:
  #
  #   - PR default (no full-bitwise label, not a schedule event):
  #       1 case (keliya) = 1 job, wall-clock ≤ 4 min
  #   - PR with `full-bitwise` label OR schedule (nightly cron):
  #       4 cases = 4 jobs, timeout ≥ 25 min
  #
  # Emitting the matrix from a separate setup job avoids stub matrix entries
  # gated by `if:` (which would still show as skipped checks on the PR UI,
  # confusing readers). The matrix JSON is exposed via job outputs and the
  # consumer job pulls it via `fromJson(needs.setup.outputs.matrix)`.
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mode: ${{ steps.matrix.outputs.mode }}
    steps:
      - name: Notice excluded cases (spec b0-tag-ci-integration L18-28)
        run: |
          echo "::notice title=Excluded cases::kashigeer endpoint=deferred-upstream (per S0-13 spec amendment); heihe / heihe_x4 endpoint=server-only (no forcing data on GitHub runner). See benchmarks/INDEX.md for the full case×endpoint matrix."

      - name: Compute build matrix (fast-feedback vs full-bitwise)
        id: matrix
        run: |
          # `contains()` returns string "true"/"false"; quote both sides
          # to keep bash test happy on PR events where labels may be empty.
          full_bitwise_label="${{ contains(github.event.pull_request.labels.*.name, 'full-bitwise') }}"
          if [[ "${{ github.event_name }}" == "schedule" || "$full_bitwise_label" == "true" ]]; then
            # 4-job full matrix: 4 cases (S2 capstone collapsed axis)
            echo 'matrix={"case":["keliya","xinanjiang_upstream","qinyijiang","qhh"]}' >> "$GITHUB_OUTPUT"
            echo 'mode=full-bitwise' >> "$GITHUB_OUTPUT"
            echo "::notice title=serial-baseline matrix mode::full-bitwise (4 cases = 4 jobs); trigger=${{ github.event_name }} full_bitwise_label=$full_bitwise_label"
          else
            # 1-job PR fast-feedback: 1 case (keliya)
            echo 'matrix={"case":["keliya"]}' >> "$GITHUB_OUTPUT"
            echo 'mode=fast-feedback' >> "$GITHUB_OUTPUT"
            echo "::notice title=serial-baseline matrix mode::fast-feedback (1 case = 1 job, keliya only); add `full-bitwise` label or wait for nightly cron to run all 4 cases"
          fi

  # ---------------------------------------------------------------------------
  # Job 1b — tools-tests: lightweight schema + unit-test gate
  # Wires `tools/check_manifest.py --all` (7-case manifest schema gate,
  # including the forcing_dir mapping schema) and
  # `tools/check_manifest_tests/test_forcing_dir.py` (union str|dict +
  # null/malformed fixtures) into CI. Independent of matrix, runs in seconds,
  # closes the F-C-1 regression-protection gap surfaced in PR #227 review
  # (the schema validator and its fixture tests were not previously executed
  # on every PR; only 4 check_*sub-script gates were).
  # ---------------------------------------------------------------------------
  tools-tests:
    name: tools-tests (manifest schema + forcing_dir union tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: check_manifest --all (7 case schema gate, including forcing_dir mapping)
        run: uv run tools/check_manifest.py --all
      - name: test_forcing_dir (union str|dict + null/malformed fixtures)
        run: uv run tools/check_manifest_tests/test_forcing_dir.py

  # ---------------------------------------------------------------------------
  # Job 2 — build-and-compare: matrix consumer
  # ---------------------------------------------------------------------------
  build-and-compare:
    needs: setup
    # Spec mandates ubuntu-22.04 hard requirement: the locked-flag B0 golden
    # was generated against gcc/g++ on Ubuntu 22.04, so bitwise comparison
    # is meaningful only on this image. Do not promote to ubuntu-latest.
    runs-on: ubuntu-22.04
    # Timeout selected per spec L52 (full-bitwise ≥ 15 min, increased to 25
    # in S1 L293 to accommodate 4-case serial × 2-axis parallel).
    # Each individual matrix job stays under 25 min; the GitHub Actions UI
    # parallelizes per matrix entry up to the runner quota.
    timeout-minutes: 25
    # Repo-wide default is contents:read only; the matrix-proposer step needs
    # pull-requests:write for `gh pr comment` + `gh pr view`. Scoped at job
    # level to keep the rest of the job at minimum privilege.
    permissions:
      contents: read
      pull-requests: write

    strategy:
      # Continue other matrix entries even if one fails so a single broken
      # case does not mask other regressions.
      fail-fast: false
      # M7 forcing-trimmed axis (PR-A #212; m7-forcing-trim spec Requirement
      # "CI matrix forcing_trimmed=1 轴新增 + forcing_present 条件 SKIP").
      # Only value `1` is provisioned (no `0` to avoid doubling CI time);
      # the axis exists so downstream PRs can find `matrix.forcing_trimmed`
      # in job context. The "Verify trimmed forcing path" step below uses
      # this value implicitly (always enabled when forcing is present).
      matrix:
        forcing_trimmed: [1]
        case: ${{ fromJson(needs.setup.outputs.matrix).case }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1 — skip-label early exit (before any expensive work)
      # -----------------------------------------------------------------------
      # `github.event.pull_request.labels` is null on push / schedule events,
      # so the contains() call short-circuits to false. The check only fires
      # on PR events that explicitly carry `skip-baseline-ci`. Label removal
      # is tracked in #51.
      - name: Skip-label early exit
        id: skip_check
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-baseline-ci') }}" == "true" ]]; then
            echo "::notice title=serial-baseline skipped::PR carries skip-baseline-ci label; workflow exits success without running baseline compare. Remove the label to gate this PR on B0 bitwise equality."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Step 2 — repo + submodule checkout
      # -----------------------------------------------------------------------
      # `submodules: recursive` pulls SHUD/ at the pointer pinned in the
      # outer commit. S1-ci-B (#51) per spec L71-76 forces fetch-depth: 0 +
      # fetch-tags: true so `git show B0-tag:benchmarks/.../...` (golden
      # source per spec L56) resolves and `git rev-parse B0-tag^{commit}`
      # in the smoke-check step below succeeds. Without these two flags
      # the default shallow checkout silently omits annotated tags and the
      # B0-tag SHA256 compare path returns empty strings → false-PASS.
      - name: Checkout repo with SHUD submodule
        if: steps.skip_check.outputs.skipped != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # -----------------------------------------------------------------------
      # Step 2b — B0-tag reachability smoke check (S1-ci-B #51, spec L65-69 +
      # L71-76). Verifies the previous checkout step actually pulled the
      # annotated B0-tag. Without B0-tag every later `git show B0-tag:...`
      # would return empty, causing a silent false-PASS. Fail-fast here so
      # the SUNDIALS install + build matrix never starts under a broken tag.
      # -----------------------------------------------------------------------
      - name: B0-tag reachability smoke check (spec L65-76)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          if ! git rev-parse B0-tag^{commit} >/dev/null 2>&1; then
            echo "::error title=B0-tag missing or unreachable::cannot perform bitwise check; ensure actions/checkout fetch-tags: true or fetch-depth: 0 (S1-ci-B spec L71-76)."
            exit 1
          fi
          echo "B0-tag reachable: $(git rev-parse B0-tag^{commit})"

      # -----------------------------------------------------------------------
      # Step 2c — skip-baseline-ci label deleted verification (S1-ci-B #51,
      # spec L170-174). The label was removed in PR #35 (S0-13). This step
      # is a compile-time-vs-runtime guard: if a maintainer accidentally
      # recreates the label, CI fails loudly here instead of silently
      # honoring the (now-dead-but-still-present) early-exit branch above.
      # -----------------------------------------------------------------------
      - name: Verify skip-baseline-ci label deleted (spec L170-174)
        if: steps.skip_check.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--search` does fuzzy match against name+description and false-positives on
          # e.g. `s1-ci` label whose description contains "skip"-related tokens.
          # Use exact name match via --jq select() to avoid that.
          count=$(gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '[.[] | select(.name == "skip-baseline-ci")] | length')
          if [[ "$count" != "0" ]]; then
            echo "::error title=skip-baseline-ci label exists::skip-baseline-ci label MUST NOT exist; deleted in PR #35 (S0-13). Re-delete via: gh label delete skip-baseline-ci --repo $GITHUB_REPOSITORY --yes"
            exit 1
          fi
          echo "skip-baseline-ci label not present (spec L170-174 PASS)"

      # -----------------------------------------------------------------------
      # Step 2d — snapshot t_values HARD-fail window gate (S1-ci-B #51,
      # spec L102-108). For every IN-MATRIX case (keliya / xinanjiang_upstream
      # / qinyijiang / qhh — the same 4 cases in spec L228) the manifest
      # `snapshot_probe.t_values` MUST all be ≤ 7776000s = 90d, the project
      # 90-day truncation window (CLAUDE.md §90-day-truncation). Any t > 90d
      # MUST trigger ::error (HARD fail), NOT ::notice silent-skip.
      #
      # Excluded cases (heihe / heihe_x4 / kashigeer per spec L9, L16, L27)
      # are NOT iterated here: they are out of CI matrix scope and retain
      # the pre-S1 t_values; reconciliation is tracked by their separate
      # endpoint validation (server Slurm for heihe*, upstream defer for
      # kashigeer). Adding them to this gate would require manifest churn
      # outside #51's "small PR" boundary.
      # -----------------------------------------------------------------------
      - name: Validate snapshot t_values ≤ 90d window (spec L102-108)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          # awk-only extractor: zero dep (no PyYAML/yq). All 4 in-matrix
          # manifests use the same single-line flow-style pattern:
          #     snapshot_probe:
          #       t_values: [86400, 2592000, 7776000]
          # We locate the `t_values:` line under `snapshot_probe:` (NOT the
          # `output_compare` block which also has numeric tolerances) and
          # split tokens between `[` and `]`. Any value > 7776000 = 90d is
          # a HARD-fail.
          MAX_T=7776000
          fail=0
          for case_name in keliya xinanjiang_upstream qinyijiang qhh; do
            f="benchmarks/${case_name}/manifest.yaml"
            if [[ ! -f "$f" ]]; then
              echo "::error title=Missing CI-matrix manifest::$f not found; in-matrix cases must each ship a manifest.yaml"
              fail=1
              continue
            fi
            # Extract t_values numeric tokens; awk state machine flips ON
            # at `snapshot_probe:` (column-0 key) and OFF at next column-0
            # key so we never pick up t_values from siblings.
            bad_values=$(awk '
              /^[A-Za-z_]/ { in_probe = 0 }
              /^snapshot_probe:/ { in_probe = 1; next }
              in_probe && /t_values:/ {
                # Strip everything outside [ ... ]
                gsub(/^[^\[]*\[/, "")
                gsub(/\].*$/, "")
                n = split($0, arr, /[ ,]+/)
                for (i = 1; i <= n; i++) {
                  if (arr[i] ~ /^[0-9]+$/ && arr[i] + 0 > 7776000) {
                    print arr[i]
                  }
                }
              }
            ' "$f")
            if [[ -n "$bad_values" ]]; then
              joined=$(echo "$bad_values" | tr '\n' ' ' | sed 's/ $//')
              echo "::error title=snapshot t_value out of 90d window::${case_name} manifest snapshot t_value ${joined} exceeds 90d truncation END (7776000s); either re-archive within window or amend manifest (spec L102-108)."
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "Snapshot t_values 90d window gate PASS (keliya / xinanjiang_upstream / qinyijiang / qhh manifests all ≤ 7776000s)"

      # -----------------------------------------------------------------------
      # Step 3 — Macro removal grep gates (S1d.1 + S1d.2, post-#48 #49)
      # -----------------------------------------------------------------------
      # Per b0-tag-ci-integration spec L302-340 "宏移除 grep gate 作 CI 强检查":
      # current submodule pin (`ce6ee3a`) is post-S1d.2, so all 4 grep gates
      # MUST return zero matches. Any non-zero match indicates a regression
      # in the macro retirement, fail the job with a structured ::error.
      #
      # Data-INDEPENDENT: this runs even without forcing data because it
      # only inspects SHUD/src/ source files. Runs in <2 seconds.
      - name: Macro removal grep gates (S1d.1 + S1d.2)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          fail=0

          # USE_RHS_CORE retired post-S1d.1 (#47)
          if grep -rn 'USE_RHS_CORE' SHUD/src/ 2>/dev/null; then
            echo "::error title=USE_RHS_CORE not fully retired::Found above hits in SHUD/src/; S1d.1 (#47) retired this scaffold macro."
            fail=1
          fi

          # _OPENMP_ON retired post-S1d.2 (#48)
          if grep -rn '_OPENMP_ON' SHUD/src/ 2>/dev/null; then
            echo "::error title=_OPENMP_ON not fully retired::Found above hits in SHUD/src/; S1d.2 (#48) replaced single-macro with 3 orthogonal macros (SHUD_ENABLE_OPENMP_RHS / SHUD_USE_OPENMP_NVECTOR / SHUD_LEGACY_OMP_RHS)."
            fail=1
          fi

          # NV_DATA_OMP / NV_DATA_S unified to N_VGetArrayPointer in f.cpp post-S1d.2 (#48)
          if grep -nE 'NV_DATA_OMP|NV_DATA_S' SHUD/src/Model/f.cpp 2>/dev/null; then
            echo "::error title=NV_DATA_* not fully retired in f.cpp::Found above hits; S1d.2 (#48) unified the 6 RHS N_Vector entries on N_VGetArrayPointer."
            fail=1
          fi

          # N_VDestroy_Serial unified to generic N_VDestroy post-S1d.2 (#48)
          if grep -rn 'N_VDestroy_Serial' SHUD/src/ 2>/dev/null; then
            echo "::error title=N_VDestroy_Serial not fully retired::Found above hits in SHUD/src/; S1d.2 (#48) replaced with generic N_VDestroy."
            fail=1
          fi

          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All macro removal grep gates PASS (USE_RHS_CORE / _OPENMP_ON / NV_DATA_* / N_VDestroy_Serial all returned zero matches)"

      # -----------------------------------------------------------------------
      # Step 3b — S2 capstone grep gate (PR-8 #152)
      # -----------------------------------------------------------------------
      # Three deterministic gates that all MUST report 0 hits:
      #   (1) SHUD/src/ModelData/MD_f_omp.cpp file is absent (entire TU deleted)
      #   (2) tree-wide grep for the 3 `_omp` RHS receiver names returns 0 hits
      #   (3) tree-wide grep for the retired legacy gating macros returns 0 hits
      # Data-INDEPENDENT (source-only); runs in <2 seconds.
      - name: S2 capstone grep gate (MD_f_omp.cpp deleted + _omp callers 0 hits)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          set -e
          echo "=== Gate 1: MD_f_omp.cpp file absent ==="
          if [ -f SHUD/src/ModelData/MD_f_omp.cpp ]; then
            echo "::error title=S2 capstone gate 1 FAIL::SHUD/src/ModelData/MD_f_omp.cpp still exists; PR-8 (#152) deleted this TU."
            exit 1
          fi
          echo "PASS: MD_f_omp.cpp deleted"

          echo "=== Gate 2: _omp 3 functions 0 hits tree-wide ==="
          HITS=$(grep -rn 'f_update_omp\|f_loop_omp\|f_applyDY_omp' SHUD/src/ | wc -l | tr -d ' ')
          if [ "$HITS" != "0" ]; then
            echo "::error title=S2 capstone gate 2 FAIL::tree-wide grep found $HITS hits for f_update_omp/f_loop_omp/f_applyDY_omp; PR-8 (#152) retired these symbols."
            grep -rn 'f_update_omp\|f_loop_omp\|f_applyDY_omp' SHUD/src/
            exit 1
          fi
          echo "PASS: 0 hits tree-wide"

          echo "=== Gate 3: SHUD_LEGACY_OMP_RHS + LEGACY_RHS 0 hits ==="
          HITS=$(grep -rn 'SHUD_LEGACY_OMP_RHS\|LEGACY_RHS' SHUD/src/ SHUD/Makefile | wc -l | tr -d ' ')
          if [ "$HITS" != "0" ]; then
            echo "::error title=S2 capstone gate 3 FAIL::tree-wide grep found $HITS hits for SHUD_LEGACY_OMP_RHS/LEGACY_RHS; PR-8 (#152) retired the legacy gating macros."
            grep -rn 'SHUD_LEGACY_OMP_RHS\|LEGACY_RHS' SHUD/src/ SHUD/Makefile
            exit 1
          fi
          echo "PASS: 0 hits"

      # -----------------------------------------------------------------------
      # Step 3c — PR-11 S3c (#155) PassValue retirement gate
      # -----------------------------------------------------------------------
      # PR-11 deletes the legacy `PassValue()` entry-point from MD_f.cpp and
      # introduces `rhs_deterministic_gather()` in MD_rhs_core.cpp (per
      # design.md D12). Historical doc-comment references were renamed to
      # `PassValue_legacy` (does NOT match \b boundary thanks to the `_`
      # suffix) so the tree-wide grep cleanly returns 0 hits. Data-INDEPENDENT
      # (source-only); runs in <1 second.
      - name: PR-11 S3c — PassValue tree-wide 0 hits gate
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          set -e
          HITS=$(grep -rn 'PassValue\b' SHUD/src/ | wc -l | tr -d ' ')
          if [ "$HITS" != "0" ]; then
            echo "::error title=PR-11 PassValue gate FAIL::tree-wide grep found $HITS hits for PassValue; PR-11 (#155) retired this entry-point in favor of rhs_deterministic_gather()."
            grep -rn 'PassValue\b' SHUD/src/
            exit 1
          fi
          echo "PASS: PassValue 0 hits tree-wide"

      # -----------------------------------------------------------------------
      # Step 4 — tool selftests (F26 / PR #54 round-3)
      # -----------------------------------------------------------------------
      # Helper-script regression detection runs in seconds; failing here
      # short-circuits the longer SUNDIALS install + build matrix below.
      # g++/make are pre-installed on ubuntu-22.04 (no apt-get step needed).
      # Skip-label guard on each step mirrors the rest of the job so the
      # entire workflow is uniformly bypassed when the label is set.
      - name: Run rhs_snapshot test_writer
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/rhs_snapshot/test_writer.sh
      - name: Run cvode_stats_diff test
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/cvode_stats_diff/test_cvode_stats_diff.sh
      # S5c-C (#175): nFCall exclusion unit test — assert canonical_15_keys.yaml
      # + cvode_stats_diff.sh CANONICAL_KEYS both exclude nFCall (per spec
      # "15-key snapshot 不包含 nFCall" + design D10 F19 round-2). The CI
      # runner does not have uv pre-installed at this early helper-script
      # stage (uv setup happens later for the S4 manifest validation step);
      # this single bare-python3 invocation is the documented exception to
      # the CLAUDE.md "uv only" rule because pyyaml is the sole dependency
      # and `python3 -m pip install --quiet pyyaml` is sufficient.
      - name: Run 15-key excludes nFCall unit test
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/cvode_stats_diff/test_15key_excludes_nfcall.py
      # S5d.1 (#178): RHS hot-field grep gate — assert MD_layout.hpp +
      # RHS 3 files align with docs/b1b/s5d_hot_fields.yaml. See spec
      # s5d-data-layout-soa-numa Scenario "RHS hot path 改读 SoA". The
      # tool fails on any `Ele[<expr>].<hot-field>` hit in the three
      # hot-path TUs (method invocations are excluded per design D2
      # double-track contract). Same bare-python3 + pyyaml exception
      # as the 15-key gate above; uv is not yet set up at this stage.
      - name: Run S5d.1 hot field grep gate (#178)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/check_manifest/check_hot_fields.py
      # S5d.2-5a (#179): RHS hot-path bare flat-index grep gate. Asserts
      # the 4 hot-path TUs (MD_ElementFlux.cpp / MD_f.cpp /
      # MD_f_uncouple.cpp / MD_update.cpp) use ONLY QeleSurfAt(i,j) /
      # QeleSubAt(i,j) accessors — no bare
      # QeleSurf_flat[...] / QeleSub_flat[...] indexing. See spec
      # s5d-data-layout-soa-numa Scenario "inline 访问器全 hot 路径生效".
      # Zero third-party deps (pure stdlib), no pip install needed.
      - name: Run S5d.2-5a no-bare-flat-index grep gate (#179)
        if: steps.skip_check.outputs.skipped != 'true'
        run: python3 tools/check_manifest/check_no_bare_flat_index.py
      # S5d.2-5a (#179): tree-wide `double **` declaration gate for
      # QeleSurf / QeleSub. Asserts the jagged 2-D form has been fully
      # retired; only `double *_flat` form may remain. Spec Scenario
      # "QeleSurf/QeleSub 改一维".
      - name: Run S5d.2-5a QeleSurf/QeleSub double** retirement gate (#179)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          set -e
          HITS=$(grep -rnE 'double \*\*\s*(QeleSurf|QeleSub)\b' SHUD/src/ | wc -l | tr -d ' ')
          if [ "$HITS" != "0" ]; then
            echo "::error title=S5d.2-5a double** gate FAIL::tree-wide grep found $HITS hits for `double **QeleSurf` / `double **QeleSub`; S5d.2-5a (#179) retired the jagged 2-D declarations in favor of `double *_flat`."
            grep -rnE 'double \*\*\s*(QeleSurf|QeleSub)\b' SHUD/src/
            exit 1
          fi
          echo "PASS: 0 hits of `double **QeleSurf|QeleSub` tree-wide"
      # S5d.2-5a (#179): malloc_EleRiv nested-alloc retirement gate.
      # Asserts `new double*[NumEle]` / `new double[3]` jagged pattern
      # is fully removed from Model_Data.cpp; only single contiguous
      # `new double[NumEle * 3]` allocations remain. Spec Scenario
      # "嵌套 malloc 全删".
      - name: Run S5d.2-5a malloc_EleRiv nested-alloc retirement gate (#179)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          set -e
          # Strip line + block comments before grep so the historical
          # `* QeleSurf = new double *[NumEle];` reference in the
          # doc-comment of malloc_EleRiv() does not trip the gate.
          # Use python for predictable comment stripping; the file is
          # ~1k lines so this is microseconds.
          python3 - <<'PYEOF'
          import re, sys, pathlib
          p = pathlib.Path("SHUD/src/ModelData/Model_Data.cpp")
          text = p.read_text()
          # Remove block comments + line comments
          text = re.sub(r"/\*.*?\*/", "", text, flags=re.DOTALL)
          text = re.sub(r"//[^\n]*", "", text)
          # The jagged pattern is `new double *[NumEle]` (the outer
          # pointer-of-pointer allocation). After S5d.2-5a it must be
          # ZERO in active code.
          jagged = re.findall(r"new\s+double\s*\*\s*\[", text)
          if jagged:
              print(f"FAIL: malloc_EleRiv still uses nested `new double*[...]`: {len(jagged)} hits")
              sys.exit(1)
          # The contiguous form must appear at least twice
          # (QeleSurf_flat + QeleSub_flat). Count `new double[NumEle * 3]`
          # tolerant of whitespace.
          contig = re.findall(r"new\s+double\s*\[\s*NumEle\s*\*\s*3\s*\]", text)
          if len(contig) < 2:
              print(f"FAIL: expected ≥2 `new double[NumEle * 3]` contiguous allocs in Model_Data.cpp, found {len(contig)}")
              sys.exit(1)
          print(f"PASS: 0 nested `new double*[...]` hits; {len(contig)} contiguous `new double[NumEle * 3]` allocs in malloc_EleRiv")
          PYEOF
      # S5d.3 (#181): parallel first-touch pragma count gate. Asserts the
      # 4 documented `#pragma omp parallel for` sites (3 in Model_Data.cpp
      # malloc_EleRiv + 1 in MD_initialize.cpp LoadIC) remain present in
      # source. Spec Scenario "三处 first-touch 全部命中" requires >= 3
      # hits; we count and fail closed if regression deletes them. Pure
      # grep, zero deps. Per PR #199 Phase 5 repair (B-S2 fold-in).
      - name: Run S5d.3 first-touch pragma count gate (#181)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          HITS=$(grep -rnE '#pragma omp parallel for' SHUD/src/ModelData/Model_Data.cpp SHUD/src/ModelData/MD_initialize.cpp | wc -l | tr -d ' ')
          if [ "$HITS" -lt 3 ]; then echo "::error::expected >=3 #pragma omp parallel for sites, found $HITS"; exit 1; fi
          echo "PASS: $HITS pragma sites (>=3 spec gate)"

      # S5d.4 (#182): manifest omp_env schema gate. Asserts every
      # benchmarks/<case>/manifest.yaml carries the canonical
      # `omp_env: {OMP_PROC_BIND: close, OMP_PLACES: cores}` block.
      # Spec s5d-data-layout-soa-numa Requirement "线程绑定 run script
      # 与 manifest 字段必填" Scenario "7 case manifest 全有 omp_env
      # 字段". Same bare-python3 + pyyaml exception as the S5d.1/.2
      # gates above — uv is set up later in the workflow but this gate
      # runs early to fail fast if a new manifest forgets the block.
      - name: Run S5d.4 manifest omp_env schema gate (#182)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/check_manifest/check_omp_env.py
      - name: Run sbatch preflight selftest
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/server_validation/archive_s1_bitwise.sh --selftest-preflight

      # -----------------------------------------------------------------------
      # Step 4b — S4 PR-10 (#154) topology manifest schema validation
      # -----------------------------------------------------------------------
      # Per spec s4-adjacency-topology Scenario "manifest 文件存在 + schema
      # 合规 + CI 校验通过": validate docs/topology_manifest.yaml has
      #   - 7 adjacency_lists entries, each with 5 required fields
      #     (name / purpose / sort_rule / b0_source / iter_pattern)
      #   - 21 asserts entries (3 entity × 7 case), each with 4 required
      #     fields (entity / case / rule / result); optional fallback_note
      #     only on result == fail
      # Data-INDEPENDENT (yaml-only); uses `uv run python` per CLAUDE.md
      # §"Python 一律用 uv". PyYAML is pre-installed on ubuntu-22.04 runner
      # image; if missing, `uv pip install pyyaml --system` falls back.
      - name: Setup uv (S4 manifest schema validation)
        if: steps.skip_check.outputs.skipped != 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: Validate topology_manifest.yaml schema (S4 PR-10 #154)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          uv run --with pyyaml python <<'PYEOF'
          import sys, yaml
          with open('docs/topology_manifest.yaml') as f:
              data = yaml.safe_load(f)
          assert isinstance(data, dict), "manifest root must be a mapping"
          assert 'adjacency_lists' in data, "manifest missing 'adjacency_lists' key"
          assert 'asserts' in data, "manifest missing 'asserts' key"
          lists = data['adjacency_lists']
          asserts = data['asserts']
          assert isinstance(lists, list) and len(lists) == 7, \
              f"expected 7 adjacency_lists, got {len(lists)}"
          assert isinstance(asserts, list) and len(asserts) == 21, \
              f"expected 21 asserts (3 entity x 7 case), got {len(asserts)}"
          required_list_fields = {'name', 'purpose', 'sort_rule', 'b0_source', 'iter_pattern'}
          for i, entry in enumerate(lists):
              missing = required_list_fields - set(entry.keys())
              assert not missing, f"adjacency_lists[{i}] missing fields: {missing}"
          required_assert_fields = {'entity', 'case', 'rule', 'result'}
          for i, entry in enumerate(asserts):
              missing = required_assert_fields - set(entry.keys())
              assert not missing, f"asserts[{i}] missing fields: {missing}"
              # fail result MUST carry fallback_note
              if entry['result'] == 'fail':
                  assert 'fallback_note' in entry, \
                      f"asserts[{i}] result=fail must include fallback_note"
          # Verify name uniqueness
          names = [e['name'] for e in lists]
          assert len(set(names)) == 7, f"adjacency_lists names not unique: {names}"
          # Verify the 7 canonical names per spec L33-104
          expected_names = {
              'seg_by_riv', 'seg_by_ele', 'upstream_by_down',
              'riv_in_by_lake', 'ele_by_lake',
              'lake_bank_edge_by_lake', 'edge_by_ele',
          }
          assert set(names) == expected_names, \
              f"adjacency_lists names {set(names)} != spec canonical {expected_names}"
          print(f"OK: 7 adjacency_lists + 21 asserts; canonical names verified")
          PYEOF

      # -----------------------------------------------------------------------
      # Step 5 — SUNDIALS 6.0.x cache + (re)install
      # -----------------------------------------------------------------------
      # Cache key strategy:
      #   - "sundials-6.0.x-ubuntu-22.04-${HASH(SHUD/configure)}"
      #   - hashFiles on SHUD/configure captures the SUNDIALS_URL (currently
      #     pinned to v6.0.0); any change to the configure script invalidates
      #     the cache. The Makefile is NOT in the key because the locked B0
      #     compile flags do not affect SUNDIALS's own build.
      #   - OS image tag is hardcoded into the key so a future bump to
      #     ubuntu-24.04 (after openspec change) cannot accidentally restore
      #     an ABI-incompatible install.
      # On cold cache: ./configure downloads + builds CVODE 6.0.0 (~60–90 s).
      # On warm cache: actions/cache restores InstallSundials/ in <5 s.
      - name: Restore SUNDIALS install from cache
        if: steps.skip_check.outputs.skipped != 'true'
        id: sundials_cache
        uses: actions/cache@v4
        with:
          path: SHUD/InstallSundials
          key: sundials-6.0.x-ubuntu-22.04-${{ hashFiles('SHUD/configure') }}

      - name: Install SUNDIALS 6.0.x (cache miss only)
        if: steps.skip_check.outputs.skipped != 'true' && steps.sundials_cache.outputs.cache-hit != 'true'
        working-directory: SHUD
        run: |
          chmod +x ./configure
          ./configure

      # -----------------------------------------------------------------------
      # Step 6 — build three SHUD binaries (single axis post-S2 capstone)
      # -----------------------------------------------------------------------
      # PR-8 (#152) retired the LEGACY_RHS axis; we build the 3 binary modes
      # (default / profile-on / dump-on) once per matrix case.
      #
      # `make clean` between modes is defensive: SHUD's Makefile compiles
      # single-source (all .cpp in $(SRC) compiled in one shot per target),
      # so per-flag incremental compile does not happen. We do not trust
      # object-file invalidation across SHUD_DUMP_DEFINE changes.
      # Build logs are tee'd to build_<mode>.log so the failure-artifact
      # step can pick them up even when the build succeeded but a later
      # step failed.
      #
      # Flag names match SHUD/Makefile: SHUD_DUMP_RHS, SHUD_ENABLE_PROFILE.
      # Both are guarded by `$(error … must be 0 or 1, got 'X')` rules so
      # explicit `FOO=0` is required.
      - name: Build default
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=0 shud 2>&1 | tee build_default.log
          cp shud shud_default

      - name: Build profile-on
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=1 shud 2>&1 | tee build_profile.log
          cp shud shud_profile

      - name: Build dump-on
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=1 SHUD_ENABLE_PROFILE=0 shud 2>&1 | tee build_dump.log
          cp shud shud_dump

      # -----------------------------------------------------------------------
      # Step 7 — build compare_snapshot helper
      # -----------------------------------------------------------------------
      # Standalone C++17, no SUNDIALS link (per tools/compare_snapshot/Makefile
      # header comment). Builds in <5 s.
      - name: Build compare_snapshot
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: tools/compare_snapshot
        run: make all

      # -----------------------------------------------------------------------
      # Step 7b — S4 PR-10 (#154) adjacency fallback unit test
      # -----------------------------------------------------------------------
      # Builds tests/test_adjacency_fallback.cpp (SHUD/Makefile target
      # `test_adjacency_fallback`) and runs it. The test constructs a
      # synthetic Model_Data mock whose entity `.index` fields violate
      # `index == array_index + 1` and asserts that
      # build_adjacency_lists() sets `adjacency_fallback_triggered = true`
      # AND constructs lists in array-index order (NOT id-sort) — per spec
      # s4-adjacency-topology Scenario "三条 assert 在所有 6 case 都 pass
      # + fallback 单测 PASS". Failure blocks PR-10 merge.
      #
      # The Makefile recipe wraps build + run; recipe-internal pass/fail
      # message is "OK: adjacency fallback unit test PASS" or
      # "FAIL: adjacency fallback unit test"; recipe exits non-zero on
      # FAIL so this `run:` returns the same exit code unmodified.
      - name: Run S4 adjacency fallback unit test (#154)
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make test_adjacency_fallback 2>&1 | tee test_adjacency_fallback.log
          # Defense in depth: re-grep the log for the OK marker even if
          # the recipe's `&& exit 1` was somehow short-circuited.
          if ! grep -q "OK: adjacency fallback unit test PASS" test_adjacency_fallback.log; then
            echo "::error title=S4 fallback unit test FAILED::test_adjacency_fallback did not print OK marker; see SHUD/test_adjacency_fallback.log artifact."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 8 — case data availability probe (parameterized on ${{ matrix.case }})
      # -----------------------------------------------------------------------
      # The compare step needs BOTH of these for the active matrix case:
      #   - SHUD/Basins/<case>/forcing/X*.csv     (forcing CSVs)
      #   - SHUD/Basins/<case>/input/<case>/<case>.cfg.para  (must exist; END
      #                                                       rewrite happens
      #                                                       in step 9)
      # Neither is in the git history (see file header comment block).
      # If absent for the active case, we skip the run+compare steps but DO
      # NOT fail — the matrix entry still PASSes (build + grep gates ran),
      # the workflow exits success with a notice so spec's "data not deployed
      # in CI" path is unambiguous and follow-up data-deployment work can
      # plug into the existing scaffold.
      - name: Probe ${{ matrix.case }} data availability
        if: steps.skip_check.outputs.skipped != 'true'
        id: data_probe
        run: |
          forcing_present=false
          input_present=false
          if compgen -G "SHUD/Basins/${{ matrix.case }}/forcing/X*.csv" > /dev/null; then
            forcing_present=true
          fi
          if [[ -f "SHUD/Basins/${{ matrix.case }}/input/${{ matrix.case }}/${{ matrix.case }}.cfg.para" ]]; then
            input_present=true
          fi
          if [[ "$forcing_present" == "true" && "$input_present" == "true" ]]; then
            echo "data_available=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.case }} data present; will run + compare against B0 golden"
          else
            echo "data_available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.case }} data not deployed::CI runner has no ${{ matrix.case }} forcing/input data; build verification + grep gates PASSED, run+compare SKIPPED. forcing=$forcing_present input=$input_present"
          fi

      # -----------------------------------------------------------------------
      # Step 9 — fix case paths + enforce 90-day truncation
      # -----------------------------------------------------------------------
      # tools/fix_case_paths/fix_case_paths.sh:
      #   - rewrites tsd.forc line 2 to the CI runner's absolute forcing path
      #   - sets NUM_OPENMP=1 (serial mode, per S0.1b)
      #
      # IMPORTANT: fix_case_paths.sh does NOT touch START/END. Per
      # b0-tag-ci-integration spec L85-100 ("90-day truncation 在 CI 自动应用"),
      # the END = START + 90 rewrite MUST happen in CI before run. We do that
      # inline here as a deterministic awk pass against cfg.para. This keeps
      # the script change out of scope for #50 (modifying the tool would be
      # a separate spec change); the inline awk is the canonical
      # deployment-layer transform per CLAUDE.md §90-day-truncation.
      - name: Fix case paths for CI runner (${{ matrix.case }})
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: tools/fix_case_paths/fix_case_paths.sh ${{ matrix.case }}

      - name: Enforce 90-day truncation (END = START + 90)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          cfg="SHUD/Basins/${{ matrix.case }}/input/${{ matrix.case }}/${{ matrix.case }}.cfg.para"
          if [[ ! -f "$cfg" ]]; then
            echo "::error title=cfg.para missing::Expected $cfg after fix_case_paths but file not found"
            exit 1
          fi
          start=$(awk '$1=="START" {print $2; exit}' "$cfg")
          if [[ -z "$start" ]]; then
            echo "::error title=START missing in cfg.para::Could not parse START line from $cfg"
            exit 1
          fi
          new_end=$((start + 90))
          # Rewrite END in place; awk uses tab separator matching SHUD cfg.para convention.
          tmp=$(mktemp "${cfg}.XXXXXX")
          awk -v ne="$new_end" -v t="$(printf '\t')" '
            $1=="END" { printf "END%s%s\n", t, ne; next }
            { print }
          ' "$cfg" > "$tmp"
          mv "$tmp" "$cfg"
          new_end_check=$(awk '$1=="END" {print $2; exit}' "$cfg")
          if [[ "$new_end_check" != "$new_end" ]]; then
            echo "::error title=90-day truncation verification failed::Expected END=$new_end after rewrite, got $new_end_check in $cfg"
            exit 1
          fi
          echo "90-day truncation applied: START=$start, END=$new_end (delta=90) for ${{ matrix.case }}"

      # -----------------------------------------------------------------------
      # Step 9b — verify trimmed forcing path (M7, PR-A #212)
      # -----------------------------------------------------------------------
      # Per m7-forcing-trim spec Requirement "CI matrix forcing_trimmed=1 轴
      # 新增 + forcing_present 条件 SKIP" (Scenario "cfg pointer verify step
      # 存在"). The schema gate requires manifest `forcing_dir.trimmed_path`
      # to be a non-empty string (kashigeer's `null` is excluded — it is not
      # in the CI matrix per setup `Notice excluded cases`). When the
      # case forcing data is actually deployed on the runner (rare; most CI
      # has forcing_present=false), an additional tsd.forc-line-2 sanity
      # check is performed too.
      #
      # Spec L175 references a `cfg.para` `forcing_dir` line; that line does
      # NOT exist in any real cfg.para. The canonical forcing-dir pointer
      # lives at line 2 of `<case>.tsd.forc`. Workflow reads tsd.forc line 2
      # accordingly; PR-N capstone is expected to patch the spec text.
      - name: Verify trimmed forcing path (M7, PR-A #212)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          manifest="benchmarks/${{ matrix.case }}/manifest.yaml"
          if [[ ! -f "$manifest" ]]; then
            echo "::error title=Manifest missing::$manifest not found"
            exit 1
          fi
          # awk-only YAML extract: locate the `forcing_dir:` mapping then
          # pick up the `trimmed_path:` line that follows (within the same
          # indented block). Quotes are stripped. yq is intentionally NOT
          # required so the verify step has zero extra deps.
          trimmed_path=$(awk '
            /^forcing_dir:/ { in_fd = 1; next }
            in_fd && /^[A-Za-z_][A-Za-z0-9_]*:/ { in_fd = 0 }
            in_fd && /^[[:space:]]+trimmed_path:[[:space:]]*/ {
              # strip leading "  trimmed_path: " and surrounding quotes
              line = $0
              sub(/^[[:space:]]+trimmed_path:[[:space:]]*/, "", line)
              sub(/[[:space:]]*(#.*)?$/, "", line)
              gsub(/^"|"$/, "", line)
              print line
              exit
            }
          ' "$manifest")
          if [[ -z "$trimmed_path" ]]; then
            echo "::error file=$manifest::manifest forcing_dir.trimmed_path missing or empty (m7-forcing-trim BREAKING schema; PR-A #212)"
            exit 1
          fi
          if [[ "$trimmed_path" == "null" ]]; then
            echo "::error file=$manifest::manifest forcing_dir.trimmed_path=null is invalid for in-matrix case ${{ matrix.case }} (only kashigeer/deferred-upstream is allowed null, and it is excluded from CI matrix)"
            exit 1
          fi
          echo "Manifest forcing_dir.trimmed_path = $trimmed_path"
          # Sanity-cross-check tsd.forc line 2 if a trimmed forcing dir was
          # actually deployed on the runner (PR-A is mac-only; CI runners
          # typically don't ship trimmed/. So this is a best-effort gate.)
          trim_abs="SHUD/Basins/${{ matrix.case }}/forcing.trimmed"
          tsd_forc="SHUD/Basins/${{ matrix.case }}/input/${{ matrix.case }}/${{ matrix.case }}.tsd.forc"
          if [[ -d "$trim_abs" && -f "$tsd_forc" ]]; then
            tsd_line2="$(awk 'NR==2 {print; exit}' "$tsd_forc")"
            # tsd.forc line 2 is the absolute path of the *active* forcing
            # dir. We require it to point at forcing.trimmed/ when both are
            # present. Otherwise emit ::notice (forcing.trimmed not active).
            case "$tsd_line2" in
              */forcing.trimmed) echo "tsd.forc line 2 points at forcing.trimmed/ as expected" ;;
              *) echo "::notice title=tsd.forc points at non-trimmed forcing::line 2 = $tsd_line2 (manifest trimmed_path=$trimmed_path); CI does not auto-switch tsd.forc to trimmed/ in PR-A" ;;
            esac
          else
            echo "::notice title=trimmed forcing data not deployed::No SHUD/Basins/${{ matrix.case }}/forcing.trimmed on this runner; manifest schema gate PASS but runtime sanity check SKIPPED (forcing_present=true but trimmed asset not shipped to CI)"
          fi

      # -----------------------------------------------------------------------
      # Step 10a — run default + compare to B0 golden (case-parameterized)
      # -----------------------------------------------------------------------
      # Matches benchmarks/<case>/manifest.yaml run_command:
      #   cd SHUD/Basins/<case> && ../../shud <case>
      # The shud binary lives at SHUD/shud (worktree-relative); we shadow it
      # with shud_default for this run.
      - name: Run ${{ matrix.case }} with default binary
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          cp SHUD/shud_default SHUD/shud
          mkdir -p SHUD/Basins/${{ matrix.case }}/output
          rm -rf SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out
          (cd SHUD/Basins/${{ matrix.case }} && ../../shud ${{ matrix.case }}) 2>&1 | tee run_default.log
          cp SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out/${{ matrix.case }}.rivqdown.dat default_rivqdown.dat
          cp SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out/cvode_stats.txt default_cvode_stats.txt

      # -----------------------------------------------------------------------
      # Step 10b — bitwise SHA256 vs B0 golden (every *.dat)
      # -----------------------------------------------------------------------
      # Per spec L114-128 "SHA256 mismatch 的错误处理" the error message MUST
      # contain: case name, file path, expected SHA, actual SHA, AND a
      # copy-paste reproduce command. We compare every *.dat file present in
      # benchmarks/<case>/B0_output/ — keliya/qhh/qinyijiang/xinanjiang_upstream
      # all currently have rivqdown.dat as the only *.dat golden, but the
      # loop is generic so future per-case dat additions are picked up
      # automatically. Failures accumulate (no early break) so multi-file
      # mismatches surface together (spec L122-127 "聚合报告").
      - name: Compare ${{ matrix.case }} output vs B0 golden (SHA256)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          fail=0
          for golden in benchmarks/${{ matrix.case }}/B0_output/*.dat; do
            filename=$(basename "$golden")
            new_file="SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out/$filename"
            if [[ ! -f "$new_file" ]]; then
              echo "::error title=Run output missing::Expected $new_file after default run but file not found (case=${{ matrix.case }})"
              fail=1
              continue
            fi
            golden_sha=$(sha256sum "$golden" | awk '{print $1}')
            new_sha=$(sha256sum "$new_file" | awk '{print $1}')
            echo "  $filename: golden=$golden_sha new=$new_sha"
            if [[ "$golden_sha" != "$new_sha" ]]; then
              echo "::error title=B0 bitwise compare FAILED::${{ matrix.case }}/$filename SHA256 mismatch. Expected $golden_sha, got $new_sha. Reproduce: cd SHUD/Basins/${{ matrix.case }} && ../../shud ${{ matrix.case }} && sha256sum output/${{ matrix.case }}.out/$filename"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "B0 bitwise compare PASS (all *.dat for ${{ matrix.case }} match golden)"

      # -----------------------------------------------------------------------
      # Step 10b.1 — CVODE 15-key stats bitwise diff vs B0 golden
      # (S1-ci-B #51, spec L251-274)
      # -----------------------------------------------------------------------
      # Calls tools/cvode_stats_diff/cvode_stats_diff.sh (#43 / PR #54) against
      # benchmarks/<case>/B0_output/cvode_stats.txt. The canonical 15-key set
      # is { nfe, nfeLS, nni, nli, nsetups, netf, nst, npe, nps, ncfn, ncfl,
      # lenrw, leniw, lenrwLS, leniwLS } per F19 (nFCall dropped; not emitted
      # by SHUD PrintFinalStats). Any key mismatch / missing / unknown = FAIL.
      #
      # NOTE: the workflow uses worktree golden (benchmarks/<case>/B0_output/)
      # not `git show B0-tag:...`. Switching to B0-tag source is tracked in
      # spec L54-56 (Requirement "B0-tag 引用方式") but is out of scope for
      # #51 (small-PR boundary); follow-up issue covers the swap.
      - name: Compare CVODE 15-key stats vs B0 golden (${{ matrix.case }})
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          golden="benchmarks/${{ matrix.case }}/B0_output/cvode_stats.txt"
          new="default_cvode_stats.txt"
          if [[ ! -f "$golden" ]]; then
            echo "::error title=Missing CVODE stats golden::$golden not found; cannot run 15-key diff. Update benchmarks/${{ matrix.case }}/B0_output/cvode_stats.txt or amend manifest."
            exit 1
          fi
          if [[ ! -f "$new" ]]; then
            echo "::error title=CVODE stats archive missing::$new not produced by default run; SHUD did not emit cvode_stats.txt for ${{ matrix.case }}. Check default run step output."
            exit 1
          fi
          if ! bash tools/cvode_stats_diff/cvode_stats_diff.sh "$new" "$golden"; then
            echo "::error title=CVODE 15-key mismatch (${{ matrix.case }})::Any of {nfe,nfeLS,nni,nli,nsetups,netf,nst,npe,nps,ncfn,ncfl,lenrw,leniw,lenrwLS,leniwLS} drifted vs B0 golden. Reproduce: cd SHUD/Basins/${{ matrix.case }} && ../../shud ${{ matrix.case }} && bash \$GITHUB_WORKSPACE/tools/cvode_stats_diff/cvode_stats_diff.sh output/${{ matrix.case }}.out/cvode_stats.txt \$GITHUB_WORKSPACE/$golden"
            exit 1
          fi
          echo "CVODE 15-key stats invariance PASS (${{ matrix.case }})"

      # S5d.3 (#181): [NUMA] log-token presence + ordering gate on the
      # default-binary run.log. Spec L75-77: `grep -n '[NUMA] OMP_PROC_BIND='`
      # smallest line number MUST be < smallest line number of
      # `grep -n '[NUMA] first-touch begin'`. The CI runner does not set
      # OMP_PROC_BIND by default, so the unset path is hit and the
      # ordering check is vacuously satisfied (skip path emits zero
      # first-touch begin lines); but the OMP_PROC_BIND= token MUST
      # still appear once. `--mode any` accepts both paths cleanly.
      - name: Run S5d.3 [NUMA] token presence + ordering gate (#181)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: python3 tools/check_manifest/check_numa_token_order.py run_default.log --mode any

      # S5c-C (#175): independent nFCall column (NOT part of 15-key gate per
      # design D10). Free-running counter; log only, no diff vs golden.
      # Acceptance: a non-empty nfcall.txt + readable nFCall line at the
      # case output dir.
      - name: Read nFCall independent counter (${{ matrix.case }})
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          nfcall_file="SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out/nfcall.txt"
          if [[ ! -f "$nfcall_file" ]]; then
            echo "::warning title=nfcall.txt missing (${{ matrix.case }})::Expected at $nfcall_file; SHUD did not emit nFCall counter (S5c-C scope)."
            exit 0
          fi
          nfcall_val=$(awk -F= '/^nFCall=/ {print $2}' "$nfcall_file")
          nfe_val=$(awk -F= '/^nfe=/ {print $2}' "SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out/cvode_stats.txt")
          echo "::notice title=S5c-C nFCall vs nfe (${{ matrix.case }})::nFCall=${nfcall_val:-MISSING} nfe=${nfe_val:-MISSING} (free-running; D10 nFCall != nfe allowed)"

      # -----------------------------------------------------------------------
      # Step 10c — run profile-on + verify bitwise neutrality vs default
      # -----------------------------------------------------------------------
      # Profile timer is wall-clock-only; spec scenario "profile-on neutral to
      # default" requires the .dat output to be byte-identical to the default
      # build at the same flag set otherwise. Compare default_rivqdown.dat to
      # profile_rivqdown.dat by SHA256.
      - name: Run ${{ matrix.case }} with profile-on binary
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          cp SHUD/shud_profile SHUD/shud
          rm -rf SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out
          (cd SHUD/Basins/${{ matrix.case }} && ../../shud ${{ matrix.case }}) 2>&1 | tee run_profile.log
          cp SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out/${{ matrix.case }}.rivqdown.dat profile_rivqdown.dat

      - name: Verify profile-on bitwise neutral to default
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          default_sha=$(sha256sum default_rivqdown.dat | awk '{print $1}')
          profile_sha=$(sha256sum profile_rivqdown.dat | awk '{print $1}')
          echo "default SHA256: $default_sha"
          echo "profile SHA256: $profile_sha"
          if [[ "$default_sha" != "$profile_sha" ]]; then
            echo "::error title=Profile neutrality FAILED::SHUD_ENABLE_PROFILE=1 build produced different ${{ matrix.case }}.rivqdown.dat than default. Profile timer is leaking into RHS path. default=$default_sha profile=$profile_sha"
            exit 1
          fi
          echo "Profile-on bitwise neutrality PASS"

      # -----------------------------------------------------------------------
      # Step 10d — run dump-on + compare snapshots (after-PassValue + before-PassValue)
      # -----------------------------------------------------------------------
      # SHUD_DUMP_OUTPUT_DIR + SHUD_DUMP_T_VALUES + SHUD_DUMP_CASE_ID + SHUD_DUMP_SITE
      # are the runtime env consumed by the dump hooks (see
      # SHUD/src/ModelData/MD_rhs_dump.cpp init_config()).
      #
      # T_VALUES are case-relative seconds [86400, 2592000, 7776000] = 1d / 30d / 90d,
      # all reachable inside the 90-day-truncated CI run. Hook receives
      # ABS-MINUTES; we compute start_min = START * 1440 from the deployed
      # cfg.para (post-fix_case_paths + 90-day rewrite). Snapshot filenames
      # from the hook use abs-min; we map to rel-sec at compare time.
      #
      # Two snapshot sites (#43): "f_update" (legacy, after-PassValue naming
      # → snapshot_t<v>.bin) and "f_loop_before_passvalue" (#43 new,
      # SHUD_DUMP_FNAME_SUFFIX=before_passvalue →
      # snapshot_t<v>_before_passvalue.bin). All 4 cases have both sets of
      # 3 goldens checked-in under benchmarks/<case>/B0_output/.
      - name: Compute case-relative snapshot abs-min triple (${{ matrix.case }})
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        id: snapshot_times
        run: |
          cfg="SHUD/Basins/${{ matrix.case }}/input/${{ matrix.case }}/${{ matrix.case }}.cfg.para"
          start_day=$(awk '$1=="START" {print $2; exit}' "$cfg")
          start_min=$((start_day * 1440))
          # rel-sec → abs-min:  86400/60 = 1440, 2592000/60 = 43200, 7776000/60 = 129600
          t1=$((start_min + 1440))
          t2=$((start_min + 43200))
          t3=$((start_min + 129600))
          echo "case=${{ matrix.case }} START_day=$start_day START_min=$start_min"
          echo "abs-min triple: $t1, $t2, $t3"
          echo "abs_t_values=${t1},${t2},${t3}" >> "$GITHUB_OUTPUT"
          echo "t1=$t1" >> "$GITHUB_OUTPUT"
          echo "t2=$t2" >> "$GITHUB_OUTPUT"
          echo "t3=$t3" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.case }} with dump-on binary (f_update, after-PassValue)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        env:
          SHUD_DUMP_OUTPUT_DIR: ${{ github.workspace }}/snapshots_new
          SHUD_DUMP_CASE_ID: ${{ matrix.case }}
          SHUD_DUMP_SITE: f_update
          SHUD_DUMP_T_VALUES: ${{ steps.snapshot_times.outputs.abs_t_values }}
          SHUD_DUMP_T_TOL: "60"
        run: |
          mkdir -p "${SHUD_DUMP_OUTPUT_DIR}"
          cp SHUD/shud_dump SHUD/shud
          rm -rf SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out
          (cd SHUD/Basins/${{ matrix.case }} && ../../shud ${{ matrix.case }}) 2>&1 | tee run_dump.log

      - name: Run ${{ matrix.case }} with dump-on binary (f_loop_before_passvalue, #43)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        env:
          SHUD_DUMP_OUTPUT_DIR: ${{ github.workspace }}/snapshots_new
          SHUD_DUMP_CASE_ID: ${{ matrix.case }}
          SHUD_DUMP_SITE: f_loop_before_passvalue
          SHUD_DUMP_FNAME_SUFFIX: before_passvalue
          SHUD_DUMP_T_VALUES: ${{ steps.snapshot_times.outputs.abs_t_values }}
          SHUD_DUMP_T_TOL: "60"
        run: |
          mkdir -p "${SHUD_DUMP_OUTPUT_DIR}"
          rm -rf SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out
          (cd SHUD/Basins/${{ matrix.case }} && ../../shud ${{ matrix.case }}) 2>&1 | tee run_dump_before_passvalue.log

      - name: Compare ${{ matrix.case }} snapshots vs B0 golden (after + before PassValue)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          snap_dir="${{ github.workspace }}/snapshots_new"
          fail=0
          # abs-min → rel-sec mapping (inverse of step "Compute case-relative snapshot abs-min triple")
          declare -A abs_to_rel
          abs_to_rel[${{ steps.snapshot_times.outputs.t1 }}]=86400
          abs_to_rel[${{ steps.snapshot_times.outputs.t2 }}]=2592000
          abs_to_rel[${{ steps.snapshot_times.outputs.t3 }}]=7776000

          for abs_min in ${{ steps.snapshot_times.outputs.t1 }} ${{ steps.snapshot_times.outputs.t2 }} ${{ steps.snapshot_times.outputs.t3 }}; do
            rel_sec=${abs_to_rel[$abs_min]}
            for suffix in "" "_before_passvalue"; do
              new_path="${snap_dir}/snapshot_t${abs_min}${suffix}.bin"
              golden="benchmarks/${{ matrix.case }}/B0_output/snapshot_t${rel_sec}${suffix}.bin"
              if [[ ! -f "$new_path" ]]; then
                echo "::error title=Expected snapshot missing::dump-on did not produce snapshot_t${abs_min}${suffix}.bin (expected for rel_sec=${rel_sec}, site=${suffix:-f_update}, case=${{ matrix.case }}). Check SHUD_DUMP_T_VALUES + cfg.para 90-day window + dump-on build."
                fail=1
                continue
              fi
              if [[ ! -f "$golden" ]]; then
                echo "::error title=Missing golden::Generated snapshot has no archive counterpart at ${golden} (case=${{ matrix.case }})."
                fail=1
                continue
              fi
              echo "Comparing snapshot_t${abs_min}${suffix}.bin vs golden snapshot_t${rel_sec}${suffix}.bin..."
              if ! tools/compare_snapshot/compare_snapshot "$new_path" "$golden" 2>&1 | tee -a snapshot_compare.log; then
                echo "::error title=Snapshot diff::compare_snapshot reported diff for ${{ matrix.case }}/snapshot_t${rel_sec}${suffix}.bin; see snapshot_compare.log. Reproduce: tools/compare_snapshot/compare_snapshot benchmarks/${{ matrix.case }}/B0_output/snapshot_t${rel_sec}${suffix}.bin ${new_path}"
                fail=1
              fi
            done
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All 6 snapshots (3 t_values × 2 sites) bitwise identical to B0 golden for ${{ matrix.case }}"

      # -----------------------------------------------------------------------
      # Step 11 — verify golden SHA256 manifest (PR #54 round-1 F12)
      # -----------------------------------------------------------------------
      # tools/check_goldens/check_goldens.sh parses the 24 SHA256 rows from
      # docs/build_manifest.md (12 after-PassValue + 12 before-PassValue),
      # re-computes sha256sum of each listed file in benchmarks/<case>/B0_output,
      # and fails the build if any row mismatches. This catches drift between
      # checked-in goldens and the doc manifest BEFORE a B0 bitwise compare PR
      # can mask it. Runs unconditionally (data-independent, source-only check)
      # but stays inside the matrix so each axis verifies the same manifest;
      # matrix-axis redundancy is harmless and gives 2× / 8× signal coverage.
      - name: Verify golden SHA256 manifest
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/check_goldens/check_goldens.sh

      # -----------------------------------------------------------------------
      # Step 12 — failure artifact upload
      # -----------------------------------------------------------------------
      # Per spec Requirement "CI artifact uploads on failure": on any failure
      # (build, run, or compare), package build logs + new outputs + new
      # snapshots + compare stdout/stderr into `baseline-failure-diff`.
      # `if: failure()` fires only when an earlier step failed; the artifact
      # is keyed by (case, axis) to disambiguate matrix-entry failures.
      # `if-no-files-found: ignore` because skip-label runs produce none of
      # these and the action would warn on an empty match list.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-failure-diff-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            SHUD/build_default.log
            SHUD/build_profile.log
            SHUD/build_dump.log
            SHUD/test_adjacency_fallback.log
            run_default.log
            run_profile.log
            run_dump.log
            run_dump_before_passvalue.log
            default_rivqdown.dat
            profile_rivqdown.dat
            default_cvode_stats.txt
            snapshot_compare.log
            snapshots_new/**

      # ----------------------------------------------------------------------
      # Step 13 — propose-status-matrix-update (S0-12 / openMP #16)
      #
      # Per `openspec/.../specs/status-matrix/spec.md` Requirement
      # "Matrix updated by CI on baseline runs": on a PR that runs the real
      # compare path (data_available=true and the SHA256/snapshot gates all
      # PASS), comment a suggested diff for `docs/status_matrix.md` updating
      # the (B0, <case>) cell to PASS for the merging commit. Maintainer
      # applies via a follow-up PR; CI never push back to baseline/current
      # (per spec L19 — avoids concurrent-write races and partial writes
      # under skip-label PRs).
      #
      # Skip conditions (any one suppresses the proposer):
      #   - PR carries `skip-baseline-ci` label (workflow already early-exits)
      #   - This is a push / schedule event (no PR to comment on)
      #   - Data probe set `data_available=false` (no real compare to attest)
      #   - Any earlier step failed (already covered by `if: success()`)
      # ----------------------------------------------------------------------
      - name: Propose status-matrix update
        if: >
          success() &&
          steps.skip_check.outputs.skipped != 'true' &&
          github.event_name == 'pull_request' &&
          steps.data_probe.outputs.data_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CASE_NAME: ${{ matrix.case }}
        run: |
          # Compose the suggested matrix diff. Per spec scenario "CI proposes
          # update via PR comment", the comment SHOULD include a diff-style
          # snippet a maintainer can copy verbatim into a follow-up PR.
          # The comment marker includes case name so per-case proposals can
          # coexist on a full-bitwise PR without overlapping.
          cat > /tmp/matrix_comment.md <<EOF
          <!-- s0-12-matrix-proposer:${CASE_NAME} -->
          ## Status matrix update proposal (CI auto-generated, case=${CASE_NAME})

          The serial-baseline workflow built + compared \`${CASE_NAME}\` at commit
          \`$COMMIT_SHA\` and the (B0, ${CASE_NAME})
          cell is PASS as of this run. Per \`status-matrix\` spec L19, CI does
          **not** push to \`baseline/current\` directly. Maintainer to apply
          the suggested edit below via a follow-up PR (or merge this PR if it
          already touches \`docs/status_matrix.md\`).

          \`\`\`diff
          --- a/docs/status_matrix.md
          +++ b/docs/status_matrix.md
          @@ B0 row evidence @@
          -| ${CASE_NAME} | PASS | ... existing evidence ... |
          +| ${CASE_NAME} | PASS | ... existing evidence ... + CI confirmed @ \`$COMMIT_SHA\` |
          \`\`\`

          ### What was actually verified

          - Default build (\`SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=0\`) → ${CASE_NAME}
            output SHA256 matches \`benchmarks/${CASE_NAME}/B0_output/*.dat\`
          - Profile-on build (\`SHUD_ENABLE_PROFILE=1\`) → bitwise neutral to default
          - Dump-on build (\`SHUD_DUMP_RHS=1\`) → 6 snapshots (3 t × 2 sites)
            match \`benchmarks/${CASE_NAME}/B0_output/snapshot_t*.bin\`

          Other rows / cells in the matrix are not affected by this run.
          EOF

          # Idempotency: match on a stable HTML-comment marker (case-scoped)
          # that survives title edits, emoji rendering changes, and
          # user-added prefixes. `gh pr view` errors propagate (no 2>/dev/null
          # swallow) so a 403 surfaces loudly instead of silently posting a
          # duplicate.
          existing=$(gh pr view "$PR_NUM" --json comments \
            --jq ".comments[] | select(.body | contains(\"<!-- s0-12-matrix-proposer:${CASE_NAME} -->\")) | .url" \
            | head -1)
          if [[ -n "$existing" ]]; then
            echo "::notice title=status-matrix proposer::existing proposer comment for ${CASE_NAME} found at $existing; skipping duplicate"
            exit 0
          fi
          gh pr comment "$PR_NUM" --body-file /tmp/matrix_comment.md
          echo "::notice title=status-matrix proposer::posted (B0, ${CASE_NAME}) PASS suggestion to PR #$PR_NUM"

  # ---------------------------------------------------------------------------
  # Job 3 — asan-ubsan: temporary sanitizer matrix axis (S5d.2-5a #179)
  # ---------------------------------------------------------------------------
  # Per spec s5d-data-layout-soa-numa Scenario "CI workflow 加 sanitizer 临时 axis":
  # the S5d.2 jagged → flat refactor involves pointer-arithmetic restructure
  # (R2 design risk class); we gate the change behind a runtime ASan + UBSan
  # bath on keliya + qhh (lake) at 90-day NUM_OPENMP=1, asserting 0 errors
  # and 0 warnings. Scope is temporary: per spec L61 this axis can be
  # removed once S5d.4 + S6b are complete (B1b-tag locked).
  #
  # Matrix mode rules mirror the build-and-compare job for consistency:
  #   - PR default (no full-bitwise label, not a schedule event):
  #       1 case (keliya) under sanitizer — fast PR feedback
  #   - PR with `full-bitwise` label OR schedule (nightly cron):
  #       2 cases (keliya + qhh) under sanitizer — gate completeness
  #
  # We run a SEPARATE job (not a sub-axis of build-and-compare) to:
  #   1. Keep the existing matrix flat (extra `sanitizer` axis would
  #      double matrix entries even when the gate is N/A).
  #   2. Wall-clock isolation: ASan+UBSan-instrumented runs are 2-5x
  #      slower than default; failures in this job do not bottleneck
  #      the bitwise compare path.
  #   3. Per-job failure attribution: sanitizer errors are crystal-clear
  #      in the `asan-ubsan` job name rather than buried in a 4×2 grid.
  asan-ubsan:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        case:
          # PR default = keliya only (fast PR feedback); full matrix
          # (keliya + qhh) is added by the post-step if-guard below
          # based on github.event_name + label. We can't gate matrix
          # entries from setup's outputs without re-implementing the
          # matrix proposer; instead each case-step inside is no-op
          # for irrelevant cases.
          - keliya
          - qhh

    steps:
      - name: Skip-label early exit
        id: skip_check
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-baseline-ci') }}" == "true" ]]; then
            echo "::notice title=asan-ubsan skipped::PR carries skip-baseline-ci label; sanitizer gate skipped."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip non-keliya on fast-feedback PR
        id: case_gate
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          full_bitwise_label="${{ contains(github.event.pull_request.labels.*.name, 'full-bitwise') }}"
          is_schedule="${{ github.event_name == 'schedule' }}"
          if [[ "${{ matrix.case }}" == "keliya" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          elif [[ "$is_schedule" == "true" || "$full_bitwise_label" == "true" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=asan-ubsan ${{ matrix.case }} skipped::PR fast-feedback mode only runs keliya under sanitizer; add `full-bitwise` label or wait for nightly cron for qhh."
          fi

      - name: Checkout repo with SHUD submodule
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Restore SUNDIALS install from cache
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true'
        id: sundials_cache
        uses: actions/cache@v4
        with:
          path: SHUD/InstallSundials
          key: sundials-6.0.x-ubuntu-22.04-${{ hashFiles('SHUD/configure') }}

      - name: Install SUNDIALS 6.0.x (cache miss only)
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true' && steps.sundials_cache.outputs.cache-hit != 'true'
        working-directory: SHUD
        run: |
          chmod +x ./configure
          ./configure

      - name: Build shud_asan (ASan + UBSan)
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true'
        working-directory: SHUD
        run: |
          make clean
          make shud_asan 2>&1 | tee build_asan.log

      - name: Probe ${{ matrix.case }} data availability
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true'
        id: data_probe
        run: |
          forcing_present=false
          input_present=false
          if compgen -G "SHUD/Basins/${{ matrix.case }}/forcing/X*.csv" > /dev/null; then
            forcing_present=true
          fi
          if [[ -f "SHUD/Basins/${{ matrix.case }}/input/${{ matrix.case }}/${{ matrix.case }}.cfg.para" ]]; then
            input_present=true
          fi
          if [[ "$forcing_present" == "true" && "$input_present" == "true" ]]; then
            echo "data_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=${{ matrix.case }} data not deployed::CI runner has no ${{ matrix.case }} forcing/input data; build verification PASSED, sanitizer run SKIPPED."
          fi

      - name: Fix case paths for CI runner (${{ matrix.case }})
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true' && steps.data_probe.outputs.data_available == 'true'
        run: tools/fix_case_paths/fix_case_paths.sh ${{ matrix.case }}

      - name: Enforce 90-day truncation (END = START + 90)
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          cfg="SHUD/Basins/${{ matrix.case }}/input/${{ matrix.case }}/${{ matrix.case }}.cfg.para"
          start=$(awk '$1=="START" {print $2; exit}' "$cfg")
          new_end=$((start + 90))
          tmp=$(mktemp "${cfg}.XXXXXX")
          awk -v ne="$new_end" -v t="$(printf '\t')" '
            $1=="END" { printf "END%s%s\n", t, ne; next }
            { print }
          ' "$cfg" > "$tmp"
          mv "$tmp" "$cfg"
          echo "90-day truncation applied: START=$start, END=$new_end for ${{ matrix.case }}"

      - name: Run ${{ matrix.case }} under ASan + UBSan
        if: steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true' && steps.data_probe.outputs.data_available == 'true'
        env:
          # detect_leaks=0 because ASan leak detection on Linux GH runners
          # can false-positive on system library teardown ordering; the
          # gate target is OOB/UAF detection on the QeleSurf_flat / QeleSub_flat
          # access path, NOT leaks (which are tracked separately by
          # check_goldens etc.). halt_on_error=1 = first hit fails the job.
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:print_stacktrace=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          rm -rf SHUD/Basins/${{ matrix.case }}/output/${{ matrix.case }}.out
          mkdir -p SHUD/Basins/${{ matrix.case }}/output
          (cd SHUD/Basins/${{ matrix.case }} && ../../shud_asan ${{ matrix.case }}) \
            1> sanitizer_run_${{ matrix.case }}.stdout.log \
            2> sanitizer_run_${{ matrix.case }}.stderr.log
          echo "=== sanitizer_run stdout tail ==="
          tail -10 sanitizer_run_${{ matrix.case }}.stdout.log || true
          echo "=== sanitizer_run stderr summary ==="
          # Count sanitizer-emitted ERROR / WARNING lines (excluding the
          # platform-not-supported leak notice which is benign on macOS,
          # but should NOT fire on Linux GH runner anyway).
          asan_err=$(grep -cE 'AddressSanitizer.*ERROR|==.*==ERROR' sanitizer_run_${{ matrix.case }}.stderr.log || true)
          ubsan_err=$(grep -cE 'runtime error|UndefinedBehavior.*ERROR' sanitizer_run_${{ matrix.case }}.stderr.log || true)
          asan_warn=$(grep -cE 'AddressSanitizer.*WARNING|UndefinedBehaviorSanitizer.*WARNING' sanitizer_run_${{ matrix.case }}.stderr.log || true)
          echo "ASan ERROR: $asan_err"
          echo "UBSan ERROR: $ubsan_err"
          echo "Sanitizer WARNING: $asan_warn"
          # Per spec L57: "ASan 报告 0 errors 0 leaks; UBSan 报告 0 errors 0 warnings"
          if [[ "$asan_err" != "0" || "$ubsan_err" != "0" || "$asan_warn" != "0" ]]; then
            echo "::error title=ASan/UBSan ${{ matrix.case }} non-clean::ASan=$asan_err UBSan_err=$ubsan_err Sanitizer_warn=$asan_warn — see sanitizer_run_${{ matrix.case }}.stderr.log artifact for details."
            head -200 sanitizer_run_${{ matrix.case }}.stderr.log
            exit 1
          fi
          echo "S5d.2-5a ASan + UBSan ${{ matrix.case }} 90-day NUM_OPENMP=1 CLEAN (0 errors / 0 warnings)"

      - name: Upload sanitizer diagnostics
        # Always upload when the case actually ran (active gate satisfied
        # and data probe succeeded). Spec L55-57 makes the sanitizer log a
        # deliverable unconditionally, not only on failure (review B-B2,
        # PR #197). `if: always()` plus the same gating predicates as the
        # run step keeps the artifact present on green runs too.
        if: always() && steps.skip_check.outputs.skipped != 'true' && steps.case_gate.outputs.active == 'true' && steps.data_probe.outputs.data_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asan-ubsan-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            SHUD/build_asan.log
            sanitizer_run_${{ matrix.case }}.stdout.log
            sanitizer_run_${{ matrix.case }}.stderr.log
