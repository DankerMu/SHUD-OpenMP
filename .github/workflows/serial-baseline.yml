# =============================================================================
# serial-baseline.yml — SHUD-OpenMP build + invariant CI gate
# =============================================================================
# Spec:
#   - S0  ci-serial-baseline:   openspec/changes/s0-baseline-lock/specs/ci-serial-baseline/spec.md
#   - S1  b0-tag-ci-integration: openspec/changes/s1-rhs-core-extraction/specs/b0-tag-ci-integration/spec.md
#   - S2  openmp-macro-decoupling: openspec/changes/s2-strict-omp-full/specs/openmp-macro-decoupling/spec.md
# Issues: openmp #13 (S0-9 initial) → #50 (S1-ci-A: grep gates) → #51 (S1-ci-B:
#   fetch-tags + label deletion verify) → #71 (P3 sweep: invariant gate) →
#   #75 (S2-onramp: drop cron + full-bitwise mode, simplify matrix) →
#   follow-up cleanup PR (drop scaffolded run+compare path; KISS/YAGNI) →
#   #103 (S2 MOD-B: build matrix expanded to Config A / B / E + Config B nm gate).
#
# SCOPE:
#   This workflow gates build correctness + grep / invariant invariants only.
#   The matrix covers Config A / Config B / Config E on keliya = 3 jobs per
#   openmp-macro-decoupling spec ADDED Req 2 (S2 MOD-B / #103). Config E is
#   build-only on this workflow: runtime bitwise vs B1a-tag lands at P7 exit
#   (#100 P7-Gates) when StrictOMP dispatch becomes real (currently a
#   `std::abort()` stub per the same spec). All gates listed below are
#   active on every PR — there is no scaffolded / data-conditional path.
#   Bitwise compare (B0-tag .dat SHA256, CVODE 15-key, snapshot 90d) is
#   validated locally (4-case × 90-day) + server (heihe / heihe_x4 Slurm) per
#   docs/s1_summary.md design. If a future scope change adds forcing data to
#   a self-hosted runner, the pre-cleanup scaffold can be cherry-picked from
#   git history (parent commit of the cleanup PR has the full implementation).
#
#   What this workflow validates:
#     - 3-Config Makefile target builds succeed (default / profile-on /
#       dump-on, each on Config A / B / E rows = 9 builds total)
#     - Config B nm gate: `nm shud | grep -E ' T .*(f_update_omp|f_loop_omp|
#       f_applyDY_omp)' | wc -l == 3` (S2 MOD-B / #103; ' T ' anchor excludes
#       Linux gcc per-TU _GLOBAL__sub_I__ static-init constructor)
#     - Macro removal grep gates (USE_RHS_CORE / _OPENMP_ON / NV_DATA_OMP /
#       NV_DATA_S in f.cpp / N_VDestroy_Serial) — 0 hits across SHUD/src/
#     - tools/check_invariant_sweep.sh — 3 starter invariants
#       (tmp_dollar_pid_absence / pii_server_endpoint_absence /
#       hardcoded_start_day_absence) all [OK]
#     - skip-baseline-ci label deleted verified at runtime (spec L170-174)
#     - B0-tag reachability smoke check (annotated tag fetched via
#       fetch-depth: 0 + fetch-tags: true)
#     - tools/check_goldens/check_goldens.sh — 48 SHA256 rows
#       (build_manifest.md + repeatability files) data-independent drift gate
#
#   What this workflow does NOT validate (intentional, local-only):
#     - `make smoke_configd` (Config D OpenMP NVector runtime probe;
#       task 10.2b "smoke-compile sanity") is exercised by local
#       pre-push checks, NOT in CI, per spec ADDED Req 2 "Config C / D
#       不入 CI matrix". Recipe is preserved on every PR via
#       $(SHUD_OMP_CUTOFF_DEFINE) propagation in SHUD/Makefile.
#     - `make smoke_strictomp` (S1d.1 / #47 StrictOMP SIGABRT regression
#       smoke test) is local-only for the same scope reason.
#
# All gates listed above are active on every PR. There is no scaffolded /
# data-conditional path; bitwise compare runs locally + server (see
# docs/s1_summary.md).
#
# Skip-label note: the `skip-baseline-ci` early-exit (job 2 / step 1) still
# exists as a kill-switch and label-deletion verifier; per #51 the actual
# label was removed from the repo so the contains() check is now a
# tampering detector, not a routine bypass.
# =============================================================================

name: serial-baseline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - baseline/current
    # Default PR event types only — no labeled/unlabeled. The `full-bitwise`
    # label / mode-switching logic was removed alongside nightly cron when
    # CI scope was reframed (see SCOPE block above + docs/s1_summary.md).
    types: [opened, reopened, synchronize]
  # Nightly cron removed: per docs/s1_summary.md design, CI does NOT run
  # SHUD binary or bitwise compare. A daily cron would generate 8 jobs of
  # silently-skipped run+compare scaffold noise with zero validation signal.
  # If a future scope change adds forcing data deployment, add `schedule:`
  # back here AND restore the matrix expansion in the setup job.

# Cancel superseded runs on the same ref so PR push spam does not pile up
# in the queue. Each push to a PR cancels the previous in-flight job.
concurrency:
  group: serial-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — setup: emit the build matrix JSON
  # ---------------------------------------------------------------------------
  # Matrix is Config A / B / E × keliya = 3 jobs (S2 MOD-B / #103). Build +
  # grep + invariant gates on all 3 Configs; bitwise compare on A + B
  # (Config E build-only pre-P7, runtime bitwise lands at #100 P7-Gates).
  # Non-keliya 4-case bitwise validates locally + server per
  # docs/s1_summary.md. The setup job still emits matrix JSON via outputs so
  # build-and-compare can stay matrix-driven (vs a hardcoded job).
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Notice excluded cases (spec b0-tag-ci-integration L18-28)
        run: |
          echo "::notice title=Excluded cases::kashigeer endpoint=deferred-upstream (per S0-13 spec amendment); heihe / heihe_x4 endpoint=server-only (no forcing data on GitHub runner); xinanjiang_upstream / qinyijiang / qhh = local-validated (S1 期间已 16+ 次 bitwise PASS，CI 不跑 per docs/s1_summary.md design). See benchmarks/INDEX.md for the full case×endpoint matrix."

      - name: Emit build matrix (Config A / B / E on keliya)
        id: matrix
        # S2 MOD-B (#103): matrix expanded from rhs_path axis (Config A + B)
        # to explicit Config A / B / E `include`-list entries per spec
        # `openmp-macro-decoupling` ADDED Requirement 2 + tasks 10.2 / 10.2a /
        # 10.2b. Each entry carries its own `make_flags` so downstream steps
        # can pass them verbatim. The `config` key names the row for log /
        # artifact disambiguation.
        #
        #   - Config A: defaults (LEGACY_RHS=0; B1a serial path; bitwise vs
        #     B0-tag on keliya). No extra flags.
        #   - Config B: LEGACY_RHS=1 path retired post-S1d.1, replaced here by
        #     SHUD_LEGACY_OMP_RHS=1 which compiles the `_omp` translation
        #     unit into the binary. value-add per spec ADDED Req 2 row 3:
        #     `nm shud | grep -E ' T .*(f_update_omp|f_loop_omp|f_applyDY_omp)'
        #     | wc -l == 3` + Serial bitwise vs B0-tag (smoke-check that adding
        #     the `_omp` TU does not perturb the Serial code path).
        #   - Config E: SHUD_ENABLE_OPENMP_RHS=1 — P7 strict build target.
        #     Build-only PASS here; runtime bitwise vs B1a-tag lands at
        #     P7 exit (#100 P7-Gates) when ExecPolicy::StrictOMP dispatch
        #     becomes real (currently a `std::abort()` stub per spec
        #     ADDED Req 2 Scenario "Config C smoke-compile"). The
        #     `if: matrix.config != 'E'` guards on downstream run / compare
        #     steps enforce this boundary at job level.
        run: |
          echo 'matrix={"include":[{"config":"A","case":"keliya","make_flags":"","desc":"Config A: defaults (Serial baseline; bitwise vs B0-tag)"},{"config":"B","case":"keliya","make_flags":"SHUD_LEGACY_OMP_RHS=1","desc":"Config B: legacy _omp TU compile-in (smoke + nm 3 symbols)"},{"config":"E","case":"keliya","make_flags":"SHUD_ENABLE_OPENMP_RHS=1","desc":"Config E: P7 strict build target (build-only PASS pre-P7; runtime bitwise lands at #100 P7-Gates)"}]}' >> "$GITHUB_OUTPUT"
          echo "::notice title=serial-baseline matrix::Config A / B / E × keliya = 3 jobs. Build + grep + invariant gates on all configs; bitwise compare on A + B only (Config E build-only pre-P7, runtime bitwise at #100). See SCOPE block + docs/s1_summary.md."

  # ---------------------------------------------------------------------------
  # Job 1b — invariant-sweep: repo-wide grep gates from tools/invariants.yaml
  # ---------------------------------------------------------------------------
  # Runs tools/check_invariant_sweep.sh against the 3 starter invariants
  # (tmp_dollar_pid_absence / pii_server_endpoint_absence /
  # hardcoded_start_day_absence). Data-INDEPENDENT, ~10s on ubuntu-latest.
  # Fails the workflow if any invariant MISMATCHes — locks in F20 / F30 /
  # #56 part-A mktemp adoption, the PII server-IP gate, and PR #54 round-4
  # F33 / #57 dynamic cfg.para START parsing.
  #
  # Placement: parallel sibling to `setup`; build-and-compare depends only
  # on `setup` (matrix output), so invariant-sweep failure short-circuits
  # the whole workflow without holding back the matrix expansion.
  invariant-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # PR #71 round-1 F1: the live gate's `local globs=( $paths_csv )` form
      # silently pre-expanded `tools/**/*.sh` and made the sweep a no-op (3
      # invariants × any number of new files all returned [OK] regardless of
      # content). Self-test injects controlled bad-token sentinels into
      # multiple TRACKED files and asserts the sweep flips to [MISMATCH] +
      # exit 1 each time, so a future regression that re-breaks the glob
      # expansion fails CI BEFORE the live gate (which would still return
      # [OK] under the broken form) can mask it.
      - name: Self-test invariant sweep (PR #71 F1)
        run: bash tools/test_check_invariant_sweep.sh
      - name: Run invariant sweep (issue #56 Part B)
        run: bash tools/check_invariant_sweep.sh

  # ---------------------------------------------------------------------------
  # Job 2 — build-and-compare: matrix consumer
  # ---------------------------------------------------------------------------
  build-and-compare:
    needs: [setup, invariant-sweep]
    # Spec mandates ubuntu-22.04 hard requirement: the locked-flag B0 golden
    # was generated against gcc/g++ on Ubuntu 22.04, so bitwise comparison
    # is meaningful only on this image. Do not promote to ubuntu-latest.
    runs-on: ubuntu-22.04
    # Timeout 15 min: current matrix is keliya × Config {A,B,E} = 3 jobs and
    # each runs build (3 modes) + grep gates + tool selftests + (Config B)
    # nm gate in well under 5 min total. With fail-fast: false the 3 jobs
    # run in parallel, so wall-clock stays comfortably under the budget.
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      # Continue other matrix entries even if one fails so a single broken
      # case does not mask other regressions.
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1 — skip-label early exit (before any expensive work)
      # -----------------------------------------------------------------------
      # `github.event.pull_request.labels` is null on push / schedule events,
      # so the contains() call short-circuits to false. The check only fires
      # on PR events that explicitly carry `skip-baseline-ci`. The label
      # itself was deleted from the repo in #51 (verified by step 2c below),
      # so the branch is now a tampering kill-switch rather than a routine
      # bypass.
      - name: Skip-label early exit
        id: skip_check
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-baseline-ci') }}" == "true" ]]; then
            echo "::notice title=serial-baseline skipped::PR carries skip-baseline-ci label; workflow exits success without running baseline compare. Remove the label to gate this PR on B0 bitwise equality."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Step 2 — repo + submodule checkout
      # -----------------------------------------------------------------------
      # `submodules: recursive` pulls SHUD/ at the pointer pinned in the
      # outer commit. S1-ci-B (#51) per spec L71-76 forces fetch-depth: 0 +
      # fetch-tags: true so `git show B0-tag:benchmarks/.../...` (golden
      # source per spec L56) resolves and `git rev-parse B0-tag^{commit}`
      # in the smoke-check step below succeeds. Without these two flags
      # the default shallow checkout silently omits annotated tags and the
      # B0-tag SHA256 compare path returns empty strings → false-PASS.
      - name: Checkout repo with SHUD submodule
        if: steps.skip_check.outputs.skipped != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # -----------------------------------------------------------------------
      # Step 2b — B0-tag reachability smoke check (S1-ci-B #51, spec L65-69 +
      # L71-76). Verifies the previous checkout step actually pulled the
      # annotated B0-tag. Without B0-tag every later `git show B0-tag:...`
      # would return empty, causing a silent false-PASS. Fail-fast here so
      # the SUNDIALS install + build matrix never starts under a broken tag.
      # -----------------------------------------------------------------------
      - name: B0-tag reachability smoke check (spec L65-76)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          if ! git rev-parse B0-tag^{commit} >/dev/null 2>&1; then
            echo "::error title=B0-tag missing or unreachable::cannot perform bitwise check; ensure actions/checkout fetch-tags: true or fetch-depth: 0 (S1-ci-B spec L71-76)."
            exit 1
          fi
          echo "B0-tag reachable: $(git rev-parse B0-tag^{commit})"

      # -----------------------------------------------------------------------
      # Step 2c — skip-baseline-ci label deleted verification (S1-ci-B #51,
      # spec L170-174). The label was removed in PR #35 (S0-13). This step
      # is a compile-time-vs-runtime guard: if a maintainer accidentally
      # recreates the label, CI fails loudly here instead of silently
      # honoring the (now-dead-but-still-present) early-exit branch above.
      # -----------------------------------------------------------------------
      - name: Verify skip-baseline-ci label deleted (spec L170-174)
        if: steps.skip_check.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--search` does fuzzy match against name+description and false-positives on
          # e.g. `s1-ci` label whose description contains "skip"-related tokens.
          # Use exact name match via --jq select() to avoid that.
          count=$(gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '[.[] | select(.name == "skip-baseline-ci")] | length')
          if [[ "$count" != "0" ]]; then
            echo "::error title=skip-baseline-ci label exists::skip-baseline-ci label MUST NOT exist; deleted in PR #35 (S0-13). Re-delete via: gh label delete skip-baseline-ci --repo $GITHUB_REPOSITORY --yes"
            exit 1
          fi
          echo "skip-baseline-ci label not present (spec L170-174 PASS)"

      # -----------------------------------------------------------------------
      # Step 3 — Macro removal grep gates (S1d.1 + S1d.2, post-#48 #49)
      # -----------------------------------------------------------------------
      # Per b0-tag-ci-integration spec L302-340 "宏移除 grep gate 作 CI 强检查":
      # current submodule pin (`ce6ee3a`) is post-S1d.2, so all 4 grep gates
      # MUST return zero matches. Any non-zero match indicates a regression
      # in the macro retirement, fail the job with a structured ::error.
      #
      # Data-INDEPENDENT: this runs even without forcing data because it
      # only inspects SHUD/src/ source files. Runs in <2 seconds.
      - name: Macro removal grep gates (S1d.1 + S1d.2)
        if: steps.skip_check.outputs.skipped != 'true'
        run: |
          fail=0

          # USE_RHS_CORE retired post-S1d.1 (#47)
          if grep -rn 'USE_RHS_CORE' SHUD/src/ 2>/dev/null; then
            echo "::error title=USE_RHS_CORE not fully retired::Found above hits in SHUD/src/; S1d.1 (#47) retired this scaffold macro."
            fail=1
          fi

          # _OPENMP_ON retired post-S1d.2 (#48)
          if grep -rn '_OPENMP_ON' SHUD/src/ 2>/dev/null; then
            echo "::error title=_OPENMP_ON not fully retired::Found above hits in SHUD/src/; S1d.2 (#48) replaced single-macro with 3 orthogonal macros (SHUD_ENABLE_OPENMP_RHS / SHUD_USE_OPENMP_NVECTOR / SHUD_LEGACY_OMP_RHS)."
            fail=1
          fi

          # NV_DATA_OMP / NV_DATA_S unified to N_VGetArrayPointer in f.cpp post-S1d.2 (#48)
          if grep -nE 'NV_DATA_OMP|NV_DATA_S' SHUD/src/Model/f.cpp 2>/dev/null; then
            echo "::error title=NV_DATA_* not fully retired in f.cpp::Found above hits; S1d.2 (#48) unified the 6 RHS N_Vector entries on N_VGetArrayPointer."
            fail=1
          fi

          # N_VDestroy_Serial unified to generic N_VDestroy post-S1d.2 (#48)
          if grep -rn 'N_VDestroy_Serial' SHUD/src/ 2>/dev/null; then
            echo "::error title=N_VDestroy_Serial not fully retired::Found above hits in SHUD/src/; S1d.2 (#48) replaced with generic N_VDestroy."
            fail=1
          fi

          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All macro removal grep gates PASS (USE_RHS_CORE / _OPENMP_ON / NV_DATA_* / N_VDestroy_Serial all returned zero matches)"

      # -----------------------------------------------------------------------
      # Step 3b — S2 P1 owner-locality grep gate (#82 element + #83 river scope)
      # -----------------------------------------------------------------------
      # Verifies that the rhs_update() element + river loop bodies in
      # MD_rhs_core.cpp (the canonical runtime path under default Config A +
      # Config E builds; f.cpp dispatch routes f() → rhs_core(... Serial) →
      # rhs_update()) only write owner-local fields:
      #   - element loop: Ele[i] / qEle*[i] / Q*[i][*] (#82 scope)
      #   - river   loop: Riv[i] / uYriv[i] / Q*riv[i] (#83 scope; covers both
      #     NumRiv loops between the element loop and the post-river NumEle
      #     element-domain Qe2r_Surf/Sub zeroing loop)
      # Enforced once per build, matrix-independent (the gate is a property of
      # the SHUD source, not the Config build flag), so guarded
      # `matrix.config == 'A'` to avoid 3× redundant runs across the Config
      # A/B/E rows.
      - name: P1 owner-locality grep gate (element + river)
        if: steps.skip_check.outputs.skipped != 'true' && matrix.config == 'A'
        run: tools/check_p1_owner_locality.sh

      # -----------------------------------------------------------------------
      # Step 4 — tool selftests (F26 / PR #54 round-3)
      # -----------------------------------------------------------------------
      # Helper-script regression detection runs in seconds; failing here
      # short-circuits the longer SUNDIALS install + build matrix below.
      # g++/make are pre-installed on ubuntu-22.04 (no apt-get step needed).
      # Skip-label guard on each step mirrors the rest of the job so the
      # entire workflow is uniformly bypassed when the label is set.
      - name: Run rhs_snapshot test_writer
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/rhs_snapshot/test_writer.sh
      - name: Run cvode_stats_diff test
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/cvode_stats_diff/test_cvode_stats_diff.sh
      - name: Run sbatch preflight selftest
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/server_validation/archive_s1_bitwise.sh --selftest-preflight

      # -----------------------------------------------------------------------
      # Step 5 — SUNDIALS 6.0.x cache + (re)install
      # -----------------------------------------------------------------------
      # Cache key strategy:
      #   - "sundials-6.0.x-ubuntu-22.04-${HASH(SHUD/configure)}"
      #   - hashFiles on SHUD/configure captures the SUNDIALS_URL (currently
      #     pinned to v6.0.0); any change to the configure script invalidates
      #     the cache. The Makefile is NOT in the key because the locked B0
      #     compile flags do not affect SUNDIALS's own build.
      #   - OS image tag is hardcoded into the key so a future bump to
      #     ubuntu-24.04 (after openspec change) cannot accidentally restore
      #     an ABI-incompatible install.
      # On cold cache: ./configure downloads + builds CVODE 6.0.0 (~60–90 s).
      # On warm cache: actions/cache restores InstallSundials/ in <5 s.
      - name: Restore SUNDIALS install from cache
        if: steps.skip_check.outputs.skipped != 'true'
        id: sundials_cache
        uses: actions/cache@v4
        with:
          path: SHUD/InstallSundials
          key: sundials-6.0.x-ubuntu-22.04-${{ hashFiles('SHUD/configure') }}

      - name: Install SUNDIALS 6.0.x (cache miss only)
        if: steps.skip_check.outputs.skipped != 'true' && steps.sundials_cache.outputs.cache-hit != 'true'
        working-directory: SHUD
        run: |
          chmod +x ./configure
          ./configure

      # -----------------------------------------------------------------------
      # Step 6 — build three SHUD binaries (Config-aware: ${{ matrix.config }})
      # -----------------------------------------------------------------------
      # S2 MOD-B (#103) restructured the strategy matrix from `rhs_path` axis
      # (LEGACY_RHS={0,1}) into explicit Config A / B / E `include`-list entries
      # (see setup job matrix-emit). Each row carries its own `make_flags`:
      #   - Config A: empty (`make shud` defaults; B0 serial bitwise gate)
      #   - Config B: `SHUD_LEGACY_OMP_RHS=1` (compiles in legacy `_omp` TU;
      #     nm gate at Step 6b verifies 3 symbols)
      #   - Config E: `SHUD_ENABLE_OPENMP_RHS=1` (P7 strict build target;
      #     build-only PASS here, runtime bitwise at #100 P7-Gates)
      #
      # For each Config we still build the 3 binary modes (default / profile-on
      # / dump-on) so the bitwise / neutrality / snapshot gates remain valid on
      # each Config when scope expands to include runtime bitwise compare.
      #
      # `make clean` between modes is defensive: SHUD's Makefile compiles
      # single-source (all .cpp in $(SRC) compiled in one shot per target),
      # so per-flag incremental compile does not happen. We do not trust
      # object-file invalidation across SHUD_DUMP_DEFINE / Config changes.
      # Build logs are tee'd to build_<mode>.log so the failure-artifact
      # step can pick them up even when the build succeeded but a later
      # step failed.
      #
      # Flag names match SHUD/Makefile: SHUD_DUMP_RHS (line ~107), SHUD_ENABLE_PROFILE
      # (line ~265), SHUD_LEGACY_OMP_RHS (S1d.2 #48), SHUD_ENABLE_OPENMP_RHS
      # (S1d.1 #47). All are guarded by `$(error … must be 0 or 1, got 'X')`
      # so explicit values are required.
      - name: Build default (Config ${{ matrix.config }})
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=0 ${{ matrix.make_flags }} shud 2>&1 | tee build_default.log
          cp shud shud_default

      - name: Build profile-on (Config ${{ matrix.config }})
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=1 ${{ matrix.make_flags }} shud 2>&1 | tee build_profile.log
          cp shud shud_profile

      - name: Build dump-on (Config ${{ matrix.config }})
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=1 SHUD_ENABLE_PROFILE=0 ${{ matrix.make_flags }} shud 2>&1 | tee build_dump.log
          cp shud shud_dump

      # -----------------------------------------------------------------------
      # Step 6b — Config B nm gate (S2 MOD-B #103, spec ADDED Req 2 row 3)
      # -----------------------------------------------------------------------
      # Verifies that Config B's value-add is in place: the binary symbol
      # table contains the 3 legacy `_omp` receivers (T or t section).
      # On Config A / Config E this step is skipped — the symbols are
      # NOT expected to be linked in (Config A: TU filter-out; Config E:
      # OMP RHS macro enabled but legacy _omp filter-out unchanged).
      - name: Config B nm gate (3 legacy _omp symbols)
        if: steps.skip_check.outputs.skipped != 'true' && matrix.config == 'B'
        working-directory: SHUD
        run: |
          # Filter on ' T ' (capital T = external/global text symbol) to
          # exclude the lowercase 't' _GLOBAL__sub_I__ZN10Model_Data13f_applyDY_omp…
          # static-init constructor that Linux gcc emits per-TU. Substring
          # match on '_omp' there would inflate the count from 3 to 4.
          # macOS clang doesn't emit the static-init symbol; both platforms
          # converge to count==3 under the ' T ' anchor.
          count=$(nm shud_default 2>/dev/null | grep -E ' T .*(f_update_omp|f_loop_omp|f_applyDY_omp)' | wc -l | tr -d ' ')
          if [[ "$count" != "3" ]]; then
            echo "::error title=Config B nm gate FAIL::expected 3 _omp symbols (' T ' global), got $count"
            nm shud_default 2>/dev/null | grep -E 'f_update_omp|f_loop_omp|f_applyDY_omp' || echo "(none found)"
            exit 1
          fi
          echo "Config B nm gate PASS: 3 _omp ' T ' symbols present in binary"

      # -----------------------------------------------------------------------
      # Step 7 — verify golden SHA256 manifest (PR #54 round-1 F12)
      # -----------------------------------------------------------------------
      # tools/check_goldens/check_goldens.sh parses the 24 SHA256 rows from
      # docs/build_manifest.md (12 after-PassValue + 12 before-PassValue),
      # re-computes sha256sum of each listed file in benchmarks/<case>/B0_output,
      # and fails the build if any row mismatches. This catches drift between
      # checked-in goldens and the doc manifest BEFORE a B0 bitwise compare PR
      # can mask it. Runs unconditionally (data-independent, source-only check)
      # but stays inside the matrix so each axis verifies the same manifest;
      # matrix-axis redundancy is harmless and gives 2× / 8× signal coverage.
      - name: Verify golden SHA256 manifest
        if: steps.skip_check.outputs.skipped != 'true'
        run: bash tools/check_goldens/check_goldens.sh

      # -----------------------------------------------------------------------
      # Step 8 — failure artifact upload
      # -----------------------------------------------------------------------
      # Captures the 3-mode build logs (default / profile / dump) when any
      # earlier step fails so a maintainer can debug without re-running the
      # workflow. `if: failure()` fires only when an earlier step failed;
      # `if-no-files-found: ignore` keeps the step quiet on skip-label runs
      # (no logs produced). Bitwise / CVODE / snapshot diff lives on local +
      # server (see docs/s1_summary.md), so no run logs are uploaded here.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-failure-diff-${{ matrix.case }}-config${{ matrix.config }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            SHUD/build_default.log
            SHUD/build_profile.log
            SHUD/build_dump.log

