# =============================================================================
# serial-baseline.yml — SHUD-OpenMP S0-9 CI gate
# =============================================================================
# Spec:  openspec/changes/s0-baseline-lock/specs/ci-serial-baseline/spec.md
# Issue: openmp #13 (S0-9)
#
# What this workflow does (when keliya data is available on the runner):
#   1. Checkout repo + SHUD submodule (recursive).
#   2. Skip-label early-exit: if PR carries `skip-baseline-ci`, exit success
#      with an informational summary. S0 development period uses this exclusively
#      — every S0 PR to date sets this label (#3, #4, #5, #6, #10, #11, #12 …).
#   3. Restore SUNDIALS 6.0.x install from cache, or build it if cache misses.
#   4. Build three SHUD serial binaries with the locked B0 flag set
#      (-O2 -g -ffp-contract=off -fno-fast-math -std=c++14):
#        a. default     : SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=0  (the locked B0 binary)
#        b. profile-on  : SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=1  (timer neutrality check)
#        c. dump-on     : SHUD_DUMP_RHS=1 SHUD_ENABLE_PROFILE=0  (snapshot probe)
#   5. Run keliya with each binary, SHA256-compare default vs B0 golden,
#      SHA256-compare profile-on vs default (neutrality), and run
#      tools/compare_snapshot against benchmarks/keliya/B0_output/snapshot_t*.bin.
#   6. On any failure, upload a `baseline-failure-diff` artifact with build
#      logs + new outputs + new snapshots + compare stdout/stderr.
#
# -----------------------------------------------------------------------------
# Data strategy: STRATEGY C  (skip-label-only + scaffolded run-and-compare)
# -----------------------------------------------------------------------------
# NWM keliya forcing (SHUD/Basins/keliya/forcing/, ~30 MB) is local-only:
#   - SHUD submodule .git/info/exclude carries `/Basins/`
#   - SHUD/.gitignore line 13 (`forcing`) matches recursively
# Neither tree ships in the SHUD git history, so a CI runner has no path to
# the forcing CSVs (or the 90-day-truncated cfg.para) without external data.
#
# Strategy C is the lowest-scope-creep option for #13 itself:
#   - All current S0 PRs use the `skip-baseline-ci` label → the early-exit
#     path is the hot path; getting that correct ships value immediately.
#   - The build + run + compare steps are SCAFFOLDED: they reference real
#     Makefile flags + real compare_snapshot invocations + real benchmark
#     paths. A "keliya data probe" step guards them; if data is missing the
#     steps log a clear "data not deployed in CI" notice and the workflow
#     exits success-with-warning (so it does not green-light bad code; it
#     simply documents that compare was skipped). When data is added later,
#     the same scaffolded steps light up without further changes.
#
# Why not strategy A (vendor a tiny CI subset)?
#   - Generating a 10–50 station stripped keliya requires re-running
#     AutoSHUD + regenerating golden hashes for that subset. That work is
#     spec-level (which 10 stations? which 90 days? what are the new
#     snapshot timesteps?) and belongs in its own change. Doing it inside
#     #13 collapses two specs into one PR and bypasses the openspec gate.
#
# Why not strategy B (GitHub release artifact)?
#   - The forcing CSV set is ~30 MB raw / ~10 MB gzipped. Uploading as a
#     release asset is fine, but: (a) the asset needs a stable URL keyed
#     to the data version; (b) cache invalidation must include the data
#     SHA256; (c) the release-asset approach hides data versioning from
#     the openspec change history. Cleaner to do this as a follow-up with
#     its own spec ("ci-data-deployment").
#
# When forcing data IS deployed in CI later (follow-up issue), the only
# changes needed in this file are:
#   - Replace the `Probe keliya data` early-exit branch with the chosen
#     deployment step (rsync from artifact, gh release download, or
#     tests/ci-keliya/ vendored subset).
#   - The data probe currently inspects two paths:
#       SHUD/Basins/keliya/forcing/X*.csv         (forcing CSVs)
#       SHUD/Basins/keliya/input/keliya/keliya.cfg.para    (90d-truncated cfg)
#     A maintainer adding data must satisfy both, or rewrite the probe.
#
# -----------------------------------------------------------------------------
# Removing the skip-label at B0-tag time:
# -----------------------------------------------------------------------------
# When B0-tag is cut and S0 ships, branch protection on main / baseline/current
# MUST mark `serial-baseline / build-and-compare` as a required check, and
# the `skip-baseline-ci` label MUST be deleted from the repo (so PRs cannot
# set it). Per the spec:
#   - skip-label-honored scenario: applies BEFORE B0-tag (current state)
#   - skip-label-rejected scenario: applies AFTER B0-tag (delete the label
#     so the contains() check below trivially evaluates false)
# Deleting the label org-side is sufficient; we do not need to remove the
# `if:` branch from the YAML — once no PR can apply the label, the branch
# is dead code that documents the transition.
# =============================================================================

name: serial-baseline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - baseline/current

# Cancel superseded runs on the same ref so PR push spam does not pile up
# in the queue. Each push to a PR cancels the previous in-flight job.
concurrency:
  group: serial-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-compare:
    # Spec mandates ubuntu-22.04 hard requirement: the locked-flag B0 golden
    # was generated against gcc/g++ on Ubuntu 22.04, so bitwise comparison
    # is meaningful only on this image. Do not promote to ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # Step 1 — skip-label early exit (before any expensive work)
      # -----------------------------------------------------------------------
      # `github.event.pull_request.labels` is null on push events, so the
      # contains() call short-circuits to false. The check only fires on PR
      # events that explicitly carry `skip-baseline-ci`.
      - name: Skip-label early exit
        id: skip_check
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-baseline-ci') }}" == "true" ]]; then
            echo "::notice title=serial-baseline skipped::PR carries skip-baseline-ci label; workflow exits success without running baseline compare. Remove the label to gate this PR on B0 bitwise equality."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Step 2 — repo + submodule checkout
      # -----------------------------------------------------------------------
      # `submodules: recursive` pulls SHUD/ at the pointer pinned in the
      # outer commit. fetch-depth: 1 is sufficient for build (we do not need
      # history for SHA256 compare). The skip-label branch bypasses this so
      # skipped runs stay sub-15-second.
      - name: Checkout repo with SHUD submodule
        if: steps.skip_check.outputs.skipped != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # Step 3 — SUNDIALS 6.0.x cache + (re)install
      # -----------------------------------------------------------------------
      # Cache key strategy:
      #   - "sundials-6.0.x-ubuntu-22.04-${HASH(SHUD/configure)}"
      #   - hashFiles on SHUD/configure captures the SUNDIALS_URL (currently
      #     pinned to v6.0.0); any change to the configure script invalidates
      #     the cache. The Makefile is NOT in the key because the locked B0
      #     compile flags do not affect SUNDIALS's own build.
      #   - OS image tag is hardcoded into the key so a future bump to
      #     ubuntu-24.04 (after openspec change) cannot accidentally restore
      #     an ABI-incompatible install.
      # On cold cache: ./configure downloads + builds CVODE 6.0.0 (~60–90 s).
      # On warm cache: actions/cache restores InstallSundials/ in <5 s.
      - name: Restore SUNDIALS install from cache
        if: steps.skip_check.outputs.skipped != 'true'
        id: sundials_cache
        uses: actions/cache@v4
        with:
          path: SHUD/InstallSundials
          key: sundials-6.0.x-ubuntu-22.04-${{ hashFiles('SHUD/configure') }}

      - name: Install SUNDIALS 6.0.x (cache miss only)
        if: steps.skip_check.outputs.skipped != 'true' && steps.sundials_cache.outputs.cache-hit != 'true'
        working-directory: SHUD
        run: |
          chmod +x ./configure
          ./configure

      # -----------------------------------------------------------------------
      # Step 4 — build three SHUD binaries
      # -----------------------------------------------------------------------
      # Each build is run sequentially so the second/third can reuse the
      # first's object files? NO — SHUD's Makefile compiles single-source
      # (all .cpp in $(SRC) compiled in one shot per target), so per-flag
      # incremental compile does not happen. We `make clean` between builds
      # to guarantee a fresh binary at each flag set (defensive: do not
      # trust object-file invalidation across SHUD_DUMP_DEFINE changes).
      # Build logs are tee'd to build_<mode>.log so the failure-artifact
      # step can pick them up even when the build itself succeeded but
      # the run/compare later failed.
      #
      # Flag names match SHUD/Makefile lines 99 (SHUD_DUMP_RHS) and ~135
      # (SHUD_ENABLE_PROFILE) verbatim. The Makefile guards both with
      # `$(error … must be 0 or 1, got '$(SHUD_DUMP_RHS)')`, so the explicit
      # SHUD_DUMP_RHS=0 / SHUD_ENABLE_PROFILE=0 in each line is required.
      - name: Build default (SHUD_DUMP_RHS=0, SHUD_ENABLE_PROFILE=0)
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=0 shud 2>&1 | tee build_default.log
          cp shud shud_default

      - name: Build profile-on (SHUD_DUMP_RHS=0, SHUD_ENABLE_PROFILE=1)
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=0 SHUD_ENABLE_PROFILE=1 shud 2>&1 | tee build_profile.log
          cp shud shud_profile

      - name: Build dump-on (SHUD_DUMP_RHS=1, SHUD_ENABLE_PROFILE=0)
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: SHUD
        run: |
          make clean
          make SHUD_DUMP_RHS=1 SHUD_ENABLE_PROFILE=0 shud 2>&1 | tee build_dump.log
          cp shud shud_dump

      # -----------------------------------------------------------------------
      # Step 5 — build compare_snapshot helper
      # -----------------------------------------------------------------------
      # Standalone C++17, no SUNDIALS link (per tools/compare_snapshot/Makefile
      # header comment). Builds in <5 s.
      - name: Build compare_snapshot
        if: steps.skip_check.outputs.skipped != 'true'
        working-directory: tools/compare_snapshot
        run: make all

      # -----------------------------------------------------------------------
      # Step 6 — keliya data availability probe
      # -----------------------------------------------------------------------
      # The compare step needs BOTH of these:
      #   - SHUD/Basins/keliya/forcing/X*.csv     (~30 MB of CMFD CSVs)
      #   - SHUD/Basins/keliya/input/keliya/keliya.cfg.para  (must be 90d-truncated)
      # Neither is in the git history (see file header comment block).
      # If absent, we skip the run+compare steps but DO NOT fail — the
      # workflow exits success with a notice so the spec's "skip label
      # honored" path is unambiguous and follow-up data-deployment work
      # can plug into the existing scaffold.
      - name: Probe keliya data availability
        if: steps.skip_check.outputs.skipped != 'true'
        id: data_probe
        run: |
          forcing_present=false
          input_present=false
          if compgen -G "SHUD/Basins/keliya/forcing/X*.csv" > /dev/null; then
            forcing_present=true
          fi
          if [[ -f "SHUD/Basins/keliya/input/keliya/keliya.cfg.para" ]]; then
            input_present=true
          fi
          if [[ "$forcing_present" == "true" && "$input_present" == "true" ]]; then
            echo "data_available=true" >> "$GITHUB_OUTPUT"
            echo "keliya data present; will run + compare against B0 golden"
          else
            echo "data_available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=keliya data not deployed::CI runner has no keliya forcing/input data; build verification PASSED, run+compare SKIPPED. Track deployment in the follow-up ci-data-deployment change. forcing=$forcing_present input=$input_present"
          fi

      # -----------------------------------------------------------------------
      # Step 7a — fix case paths (forcing dir absolute path + NUM_OPENMP=1)
      # -----------------------------------------------------------------------
      # When keliya data lands, tsd.forc line 2 will reference a developer's
      # local path. tools/fix_case_paths rewrites it to the CI runner's
      # absolute path; same script already enforces NUM_OPENMP=1 (serial).
      # The 90-day truncation must be enforced by whatever ships the data
      # (per CLAUDE.md §90-day-truncation), so this step does not touch
      # START/END.
      - name: Fix case paths for CI runner
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: tools/fix_case_paths/fix_case_paths.sh keliya

      # -----------------------------------------------------------------------
      # Step 7b — run default + compare to B0 golden
      # -----------------------------------------------------------------------
      # Matches benchmarks/keliya/manifest.yaml run_command:
      #   cd SHUD/Basins/keliya && ../../shud keliya
      # The shud binary lives at SHUD/shud (worktree-relative); we shadow it
      # with shud_default for this run.
      - name: Run keliya with default binary
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          cp SHUD/shud_default SHUD/shud
          mkdir -p SHUD/Basins/keliya/output
          rm -rf SHUD/Basins/keliya/output/keliya.out
          (cd SHUD/Basins/keliya && ../../shud keliya) 2>&1 | tee run_default.log
          cp SHUD/Basins/keliya/output/keliya.out/keliya.rivqdown.dat default_rivqdown.dat
          cp SHUD/Basins/keliya/output/keliya.out/cvode_stats.txt default_cvode_stats.txt

      - name: Compare default output vs B0 golden (SHA256)
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          golden_sha=$(sha256sum benchmarks/keliya/B0_output/keliya.rivqdown.dat | awk '{print $1}')
          new_sha=$(sha256sum default_rivqdown.dat | awk '{print $1}')
          echo "golden SHA256: $golden_sha"
          echo "new    SHA256: $new_sha"
          if [[ "$golden_sha" != "$new_sha" ]]; then
            echo "::error title=B0 bitwise compare FAILED::default-build keliya.rivqdown.dat SHA256 mismatch vs benchmarks/keliya/B0_output/. Expected $golden_sha, got $new_sha."
            exit 1
          fi
          echo "B0 bitwise compare PASS (default keliya.rivqdown.dat matches golden)"

      # -----------------------------------------------------------------------
      # Step 7c — run profile-on + verify bitwise neutrality vs default
      # -----------------------------------------------------------------------
      # Profile timer is wall-clock-only; spec scenario "profile-on neutral to
      # default" requires the .dat output to be byte-identical to the default
      # build at the same flag set otherwise. Compare default_rivqdown.dat to
      # profile_rivqdown.dat by SHA256.
      - name: Run keliya with profile-on binary
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          cp SHUD/shud_profile SHUD/shud
          rm -rf SHUD/Basins/keliya/output/keliya.out
          (cd SHUD/Basins/keliya && ../../shud keliya) 2>&1 | tee run_profile.log
          cp SHUD/Basins/keliya/output/keliya.out/keliya.rivqdown.dat profile_rivqdown.dat

      - name: Verify profile-on bitwise neutral to default
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          default_sha=$(sha256sum default_rivqdown.dat | awk '{print $1}')
          profile_sha=$(sha256sum profile_rivqdown.dat | awk '{print $1}')
          echo "default SHA256: $default_sha"
          echo "profile SHA256: $profile_sha"
          if [[ "$default_sha" != "$profile_sha" ]]; then
            echo "::error title=Profile neutrality FAILED::SHUD_ENABLE_PROFILE=1 build produced different keliya.rivqdown.dat than default. Profile timer is leaking into RHS path. default=$default_sha profile=$profile_sha"
            exit 1
          fi
          echo "Profile-on bitwise neutrality PASS"

      # -----------------------------------------------------------------------
      # Step 7d — run dump-on + compare snapshots
      # -----------------------------------------------------------------------
      # SHUD_DUMP_OUTPUT_DIR + SHUD_DUMP_T_VALUES + SHUD_DUMP_CASE_ID + SHUD_DUMP_SITE
      # are the runtime env consumed by the dump hooks (see
      # SHUD/src/ModelData/MD_rhs_dump.cpp init_config()). The three golden
      # timesteps (17357760 / 17370720 / 17500320 seconds since epoch) are
      # the ones present in benchmarks/keliya/B0_output/snapshot_t*.bin —
      # these came from a 4-year B0 run; the 90-day-truncated CI run will
      # NOT hit these timesteps and will produce zero snapshots, which
      # makes the compare meaningless.
      #
      # This is a known unresolved point of CI-vs-spec tension (CLAUDE.md
      # §90-day-truncation flags it: "snapshot probe specials"). Two
      # follow-ups are needed:
      #   (1) When CI data is deployed, ship a per-CI manifest with
      #       snapshot t_values inside the 90-day window (e.g. 86400 /
      #       864000 / 7000000), and re-archive golden snapshots from a
      #       truncated B0 run.
      #   (2) OR: extend the cfg.para END to START+110 just for snapshot
      #       capture (per CLAUDE.md option ①).
      # For now we run the dump-on binary so that the build path is
      # exercised, but treat zero snapshots as expected and only invoke
      # compare_snapshot if any are produced. The skip+notice keeps the
      # workflow honest: it will not green-light a missing snapshot, only
      # explain why the compare is gated.
      - name: Run keliya with dump-on binary
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        env:
          SHUD_DUMP_OUTPUT_DIR: ${{ github.workspace }}/snapshots_new
          SHUD_DUMP_CASE_ID: keliya
          SHUD_DUMP_SITE: f_update
          SHUD_DUMP_T_VALUES: "17357760,17370720,17500320"
        run: |
          mkdir -p "${SHUD_DUMP_OUTPUT_DIR}"
          cp SHUD/shud_dump SHUD/shud
          rm -rf SHUD/Basins/keliya/output/keliya.out
          (cd SHUD/Basins/keliya && ../../shud keliya) 2>&1 | tee run_dump.log

      - name: Compare snapshots vs B0 golden
        if: steps.skip_check.outputs.skipped != 'true' && steps.data_probe.outputs.data_available == 'true'
        run: |
          snap_dir="${{ github.workspace }}/snapshots_new"
          fail=0
          shopt -s nullglob
          new_snaps=("${snap_dir}"/snapshot_t*.bin)
          if [[ "${#new_snaps[@]}" -eq 0 ]]; then
            echo "::notice title=No snapshots produced::dump-on run produced no snapshot_t*.bin. Likely cause: cfg.para END is 90d-truncated and the golden timesteps (200+ days) fall outside the run window. Update SHUD_DUMP_T_VALUES + re-archive goldens in the ci-data-deployment follow-up. Skipping snapshot compare."
            exit 0
          fi
          for new_snap in "${new_snaps[@]}"; do
            bname=$(basename "$new_snap")
            golden="benchmarks/keliya/B0_output/${bname}"
            if [[ ! -f "$golden" ]]; then
              echo "::error title=Unexpected snapshot::dump-on produced ${bname} but no corresponding golden in benchmarks/keliya/B0_output/. Re-archive goldens or fix SHUD_DUMP_T_VALUES."
              fail=1
              continue
            fi
            echo "Comparing $bname against golden..."
            if ! tools/compare_snapshot/compare_snapshot "$new_snap" "$golden" 2>&1 | tee -a snapshot_compare.log; then
              echo "::error title=Snapshot diff::compare_snapshot reported diff for $bname; see snapshot_compare.log"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "All snapshots bitwise identical to B0 golden"

      # -----------------------------------------------------------------------
      # Step 8 — failure artifact upload
      # -----------------------------------------------------------------------
      # Per spec Requirement "CI artifact uploads on failure": on any failure
      # (build, run, or compare), package build logs + new outputs + new
      # snapshots + compare stdout/stderr into `baseline-failure-diff`.
      # `if: failure()` fires only when an earlier step failed; the artifact
      # is keyed by run id so multiple failures in the same PR push history
      # do not collide.
      # `if-no-files-found: ignore` because skip-label runs produce none of
      # these and the action would warn on an empty match list.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-failure-diff
          if-no-files-found: ignore
          retention-days: 14
          path: |
            SHUD/build_default.log
            SHUD/build_profile.log
            SHUD/build_dump.log
            run_default.log
            run_profile.log
            run_dump.log
            default_rivqdown.dat
            profile_rivqdown.dat
            default_cvode_stats.txt
            snapshot_compare.log
            snapshots_new/**
