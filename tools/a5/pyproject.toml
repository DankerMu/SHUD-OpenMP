[project]
name = "a5"
version = "1.0.0"
description = "A5 hydrology-acceptable validation pipeline for SHUD solver/policy substitution studies"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SHUD-OpenMP team" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.scripts]
a5 = "a5.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
