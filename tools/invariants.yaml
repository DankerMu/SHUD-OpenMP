# tools/invariants.yaml — repo-wide grep-based invariants
#
# Schema (parsed by tools/check_invariant_sweep.sh):
#   invariants:
#     - id: <slug>
#       token: '<literal-string-or-regex>'      # OR hex_token (XOR; exactly one)
#       hex_token: '<lowercase-hex-no-0x>'      # OR token (XOR); use this for PII / endpoints
#                                               # so the literal never lands in this tracked file.
#                                               # Decoded at scan time via `xxd -r -p`.
#       regex: 'false'  # default 'false' = fixed-string (grep -F); 'true' = extended regex (grep -E)
#       expected_absent_in:
#         - '<path-or-glob>'        # path patterns expanded via shell glob (bash globstar)
#       rationale: |
#         <why this regression must not happen>
#
# Adding an invariant:
#   1. Pick a token that ONLY appears when the regression you fear has
#      reappeared. False-positive on documentation comments? Either narrow
#      the token (`/tmp/$$` is fine; `nFCall` is too generic) or scope the
#      paths to exclude doc files.
#   2. If the token itself is PII or otherwise sensitive (e.g. a server IP),
#      use `hex_token` instead of `token` so the literal never appears in
#      this tracked spec file. Generate with: `printf '%s' '<literal>' | xxd -p`.
#   3. Add the entry below; locally `bash tools/check_invariant_sweep.sh`
#      MUST emit [OK] (token absent everywhere expected) before commit.
#   4. CI's `invariant-sweep` job (.github/workflows/serial-baseline.yml)
#      enforces these on every PR push.
#
# Rationale for the 3 starter invariants (Part B of issue #56, PR <this>):
#   - tmp_dollar_pid_absence:        anti-regression for F20 / F30 / #56 part-A
#                                    mktemp adoption — predictable /tmp paths
#                                    are a TOCTOU / symlink-attack vector on
#                                    shared hosts.
#   - pii_server_endpoint_absence:   prevents the prod server IP from ever
#                                    landing in a tracked file (it currently
#                                    lives only in CLAUDE.md which is in
#                                    .gitignore; this gate keeps it that way).
#                                    Uses hex_token so this spec file itself
#                                    is clean of the IP literal (PR #71 fix).
#   - hardcoded_start_day_absence:   PR #54 round-4 F33 + #57 follow-up moved
#                                    both tools/snapshot_repeatability/run.sh
#                                    and .github/workflows/serial-baseline.yml
#                                    from hardcoded keliya START=12053 to
#                                    awk-parsed cfg.para. The literal `12053`
#                                    must not silently come back into either
#                                    file (case-portable parse).
#
# Excluded invariant — nFCall_absence (proposed in issue #56 Part B brief):
#   nFCall is a LEGITIMATE live SHUD internal counter in SHUD/src/Model/f.cpp
#   (incremented in 4 places) AND a documented-as-excluded key in CVODE stats
#   comments in tools/cvode_stats_diff/cvode_stats_diff.sh + SHUD_openMP_master_plan.md.
#   A simple grep gate against the brief's listed paths would false-positive
#   on the 3 explanatory mentions in cvode_stats_diff.sh and 3 mentions in
#   master_plan.md immediately. Locking nFCall out of CVODE stats output
#   requires source-aware parsing (skip comments / docstrings); deferred to
#   a follow-up when there is a real regression vector to gate against.

invariants:
  - id: tmp_dollar_pid_absence
    token: '/tmp/$$'
    regex: false
    expected_absent_in:
      - 'tools/**/*.sh'
    rationale: |
      Predictable /tmp/$$ paths are TOCTOU / symlink-attack vectors on
      shared hosts. All shell tools must use mktemp + EXIT trap (see
      F20 archive_s1_bitwise.sh, F30 cvode_stats_diff.sh, #56 part-A
      archive_b0_output.sh). Adding any new occurrence regresses the
      hardening work.

  - id: pii_server_endpoint_absence
    # hex-encoded so this spec file itself does not contain the literal IP.
    # Decode (offline reference): `echo '3231302e37372e37372e3232' | xxd -r -p`.
    # The check tool decodes at scan time; the literal is never persisted to
    # disk inside the repo. PR #71 round-1 fix (F3): removes self-referential
    # PII leak introduced by the original `token:` form.
    hex_token: '3231302e37372e37372e3232'
    regex: false
    expected_absent_in:
      - '**/*'
    rationale: |
      The production server IP must never appear in a tracked file. It
      lives only in CLAUDE.md (gitignored, per-machine). Any leak into
      a tracked file would publish credentials-adjacent infrastructure
      detail to the open repository.

  - id: hardcoded_start_day_absence
    token: '12053'
    regex: false
    expected_absent_in:
      - '.github/workflows/serial-baseline.yml'
      - 'tools/snapshot_repeatability/run.sh'
    rationale: |
      keliya START day = 12053 was historically hardcoded into both the
      snapshot_repeatability harness and the CI workflow. PR #54 round-4
      F33 + issue #57 follow-up replaced both with `awk '$1=="START"
      {print $2}' cfg.para` parsing so any case is supported and case-
      portable cfg.para updates flow through automatically. This gate
      locks that fix in. Comment references (e.g. "...START<TAB>12053
      format example..." in run.sh:100) are inside `# `-prefixed lines
      and are filtered out by the sweep tool's comment-line stripper.

  # ---------------------------------------------------------------------------
  # S2 P7-Gates (#100 / Task 8.8) — 4 invariants
  #
  # Spec authority:
  #   openspec/changes/s2-strict-omp-full/specs/p7-final-fusion-omp-cutoff/spec.md
  #     Requirement L45  "Single parallel region in MD_rhs_core.cpp (C7 strict gate)"
  #     Requirement L56  "`#pragma omp for` only, ban `parallel for` and dynamic/guided"
  #     Requirement L113 "P7 exit acceptance"
  #   openspec/changes/s2-strict-omp-full/specs/exec-policy-enum/spec.md
  #     MODIFIED Req 1 L37-L40 "ProductionOMP NDEBUG stub MUST use std::abort()"
  #
  # These 4 are "negative" regression gates — the sweep tool's expected_absent_in
  # schema enforces "token MUST NOT appear in listed files". For the positive
  # "exactly 1 parallel region" assertion (count == 1) the spec demands, see
  # tools/check_p7_single_region.sh (count-based gate wired into CI).
  # ---------------------------------------------------------------------------

  - id: p7_single_parallel_region_strict
    # NOTE on effective enforcement: this YAML token starts with `#`
    # which the sweep tool's strip_comments filter (`^[[:space:]]*#`)
    # removes BEFORE the grep runs. The sweep is intentionally
    # designed for shell / yaml / python `#` comments and unavoidably
    # blinds itself to C++ preprocessor directives. Real enforcement
    # of this gate lives in tools/check_p7_single_region.sh (run from
    # .github/workflows/serial-baseline.yml), which:
    #   - counts the SCOPE's `#pragma omp parallel` regions (must == 1)
    #   - bans `#pragma omp parallel for` (no second fork-join)
    # The YAML entry remains as the SPECIFICATION identifier so the
    # 4-tuple required by issue #100 task 8.8 is visible here.
    token: '#pragma omp parallel for'
    regex: false
    expected_absent_in:
      - 'SHUD/src/Model/MD_rhs_core.cpp'
    rationale: |
      P7 single parallel region invariant (spec p7-final-fusion-omp-cutoff
      Req L45 + Scenario L63). The P7 fusion design demands EXACTLY ONE
      `#pragma omp parallel default(none)` region inside rhs_core_omp; any
      `#pragma omp parallel for` would produce a SECOND fork-join region,
      doubling the fork-join cost per RHS call and breaking C7 fork-join
      minimization (plan §1.2 C7 + §6 P7.2 强制规则 #2). Stage worksharing
      MUST use the inner `#pragma omp for schedule(static)` form chained
      under the single outer parallel region.
      ACTUAL CI enforcement: tools/check_p7_single_region.sh
      (count == 1 positive gate + zero `parallel for` negative gate).
      This YAML entry serves as the spec identifier; the helper script
      is the runtime gate (the sweep tool's `^[[:space:]]*#` strip
      filter is blind to C++ `#pragma` directives by design).

  - id: update_element_owner_local
    token: 'Ele[i].nabr[j] - 1] +='
    regex: false
    expected_absent_in:
      - 'SHUD/src/Model/MD_rhs_core.cpp'
    rationale: |
      Stage 1 element-update owner-locality regression gate (spec
      p7-final-fusion-omp-cutoff Req L45 + p1-rhs-update-owner-local-omp
      Req "Element state update only writes Ele[i] owner"). The Stage 1
      element loop body writes ONLY to owner-local indices `Ele[i]` /
      `qEle*[i]` / `Q*[i][*]`. A cross-element neighbor write of the form
      `<arr>[Ele[i].nabr[j] - 1] += <expr>` would simultaneously target
      the i-th element's neighbor (i.e. some j != i), which races across
      threads under the shared parallel region. Belt-and-suspenders
      companion to tools/check_p1_owner_locality.sh (which scopes by AST
      slice + residual scan): this YAML invariant catches the *literal
      regression pattern* sweep-wide, even if a future Stage 2 / 3 / etc.
      mistakenly inherits the pattern outside the structured slice.
      Current code uses `Ele[i].iLake - 1] +=` (Stage 2 lake gather) and
      `Ele[i].iLake - 1].NumEleLake` (read-only), but no `nabr[j] - 1] +=`
      anywhere — keeping it that way is the gate's purpose. See
      MD_rhs_core.cpp Stage 1 block (L778-L834) for the locked-in
      owner-local shape; deviation would surface here as the first
      [MISMATCH].

  - id: p5_no_reduction_atomic_critical
    # NOTE on effective enforcement (same as p7_single_parallel_region_strict
    # above): the token starts with `#` and is blind to the sweep tool's
    # `^[[:space:]]*#` strip filter. The actual enforcement is in
    # tools/check_p7_single_region.sh (gate 3 — zero `#pragma omp critical`
    # in MD_rhs_core.cpp). This YAML entry serves as the SPEC IDENTIFIER
    # so the 4-tuple required by issue #100 task 8.8 is present here.
    #
    # We pick `#pragma omp critical` (single fixed-string) because the
    # brief's recommended regex `^[[:space:]]*#pragma omp
    # (atomic|critical|reduction)` would collide with the awk parser's
    # `|` inter-field delimiter (`id|regex|token|hex_token|paths`); the
    # shell consumer's IFS='|' read truncates the token at the first
    # `|`. `#pragma omp critical` is the most likely regression vector:
    # the quickest fallback when a `+=` race surfaces under multi-thread
    # testing. Atomic / reduction siblings are guarded indirectly by:
    #   - A3a bitwise vs B1a-tag (any FP reorder fails at >=2 threads)
    #   - spec p7 Req L57 grep gates in CI
    #   - tools/check_p7_single_region.sh gate 3 (this script enforces
    #     all 3 in one place; see its docstring)
    token: '#pragma omp critical'
    regex: false
    expected_absent_in:
      - 'SHUD/src/Model/MD_rhs_core.cpp'
    rationale: |
      P5 owner-local gather invariant (spec p5-owner-local-gather Req +
      design.md §D11 "三层依赖模型" + spec p7 Req L57). The Stage 5
      gather design eliminates the need for atomic / critical /
      reduction by partitioning writes into owner-disjoint slices
      guarded by `#pragma omp for schedule(static)` + barrier
      discipline. Reintroducing `#pragma omp critical` would serialize
      the offending hot loop region — silent at 1 thread but
      catastrophic for >=2 threads (breaks both A3a bitwise FP-reorder
      gate AND C6 profile-driven priority). Scoped strictly to
      MD_rhs_core.cpp: `MD_ET.cpp` carries 1 documented pre-existing
      `#pragma omp critical` (named region per #86) which is OUT of
      scope for this gate.
      ACTUAL CI enforcement: tools/check_p7_single_region.sh gate 3.
      This YAML entry serves as the spec identifier (see NOTE comment
      above for sweep-tool blindness to `#pragma` lines).

  - id: production_omp_abort_stub_ndebug_safe
    token: 'assert\(false\)[[:space:]]*;'
    regex: true
    expected_absent_in:
      - 'SHUD/src/Model/MD_rhs_core.cpp'
    rationale: |
      ProductionOMP stub MUST use `std::abort()` (NOT `assert(false);`)
      per spec exec-policy-enum MODIFIED Req 1 L37-L40 + L67 NDEBUG
      safety. Release builds (`-DNDEBUG`) strip `assert(...)` to a no-op
      and would let execution silently fall through to the next switch
      arm, destroying the contract that ProductionOMP / unrecognized
      ExecPolicy values MUST trap rather than impersonate Serial.
      `std::abort()` is preserved at all `-DNDEBUG` levels per libc
      spec, so this is the only NDEBUG-safe choice for the OMP stubs
      and the `default:` catch-all (MD_rhs_core.cpp L642-L654 + L656-L665
      under SHUD pin 5b90a91). Token uses regex form with a trailing
      `;` to discriminate ACTUAL statement-form `assert(false);` from
      doc / comment mentions like `\`assert(false)\` is forbidden ...`
      in the file header (L568 + L647), which lack the terminating
      semicolon adjacent to the parenthesis.
