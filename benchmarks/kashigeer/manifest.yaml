# benchmarks/kashigeer/manifest.yaml
# B-Medium, NWM kashigeer basin — local & server endpoints
# River/PassValue topology stress test: NumRiv/NumEle = 0.77 (extreme dense river network).
# Field schema covers §S0.2 template + project extensions; see
# openspec/changes/s0-baseline-lock/specs/benchmark-registry/spec.md.

project_name: "ksge"                              # SHUD project name (input subdir)
description: "NWM kashigeer (ksge project) basin; river/PassValue topology stress test (NumRiv/NumEle=0.77)"

# --- OMP environment (S5d.4 #182; design D5 + master plan §S5d.4.3) ---
# Required deployment-layer thread-binding defaults. Wired via tools/run_omp.sh
# (the program does NOT override these env vars per design D5). CI schema gate:
# tools/check_manifest/check_omp_env.py + .github/workflows/serial-baseline.yml.
# (kashigeer endpoint=deferred-upstream per S0-13, see B0_output/DEFERRED.txt;
# manifest still ships canonical omp_env defaults so the CI schema gate stays
# uniform across the registry.)
omp_env:
  OMP_PROC_BIND: close
  OMP_PLACES: cores

# --- Basin scale ---
NumEle: 3204
NumRiv: 2456
NumLake: 0
NumY: 12068            # = 3*3204 + 2456 + 0

# --- Input ---
input_dir: "SHUD/Basins/kashigeer/input/ksge/"
forcing_dir:                                      # M7 schema (PR-A #212): mapping; kashigeer trimmed_path null (deferred-upstream).
  original_path: "SHUD/Basins/kashigeer/forcing/"
  trimmed_path: null                              # deferred-upstream (S0-13 amendment: X76 forcing band missing both endpoints; no trim until upstream fixed)
forcing_duration_days: 2191                       # spec-layer full length; trimmed_path window = null (deferred-upstream — see cfg_para_start/end)
# --- 90-day window deployment marker (M7 PR-B #213) ---
# cfg_para_{start,end} = cfg.para integer day-index after 90-day truncation.
# Forced exact-match against tools/forcing_trim/forcing_trim.sh resolved
# [start_day, end_day] per m7-forcing-trim spec L71-L74. Both null pending
# upstream forcing band fix (S0-13 amendment: X76 missing both endpoints).
cfg_para_start: null  # deferred-upstream
cfg_para_end:   null  # deferred-upstream
has_cryosphere: true                              # CRYOSPHERE=1 in cfg.para; Tarim glacier basin
has_lake: false
has_BC_SS: false
dry_wet_transition: true                          # arid Tarim headwater

# --- Run ---
run_command: "cd SHUD/Basins/kashigeer && ../../shud ksge"
threads: 1
expected_walltime_sec: null                       # TODO measured @ S0.8

# --- RHS snapshot probe ---
snapshot_probe:
  t_values: [86400, 864000, 8640000]              # 1 d / 10 d / 100 d
  Y_source: "cvode_state"
  arrays_to_dump:
    - "DY"
    - "QeleSurf"
    - "QeleSub"
    - "QrivSurf"
    - "QrivSub"
    - "flux_ET"

# --- Output bitwise comparison ---
output_compare:
  full_run_regression: true
  output_files:
    - "output/ksge.out/ksge.eleysurf.dat"
    - "output/ksge.out/ksge.eleyunsat.dat"
    - "output/ksge.out/ksge.eleygw.dat"
    - "output/ksge.out/ksge.eleysnow.dat"
    - "output/ksge.out/ksge.rivystage.dat"
    - "output/ksge.out/ksge.rivqdown.dat"
  cvode_stats_file: "output/ksge.out/cvode_stats.txt"
  water_balance_file: "output/ksge.out/ksge.flood.csv"

# --- Project extensions ---
endpoint: "deferred-upstream"  # S0-13 amendment: X76 forcing band missing on both endpoints; see B0_output/DEFERRED.txt
derived_from: null
refine_factor: null
