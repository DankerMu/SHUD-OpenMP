reason: |
  Upstream NWM forcing data gap, same root cause as S0-8c / #29 / #12.
  `SHUD/Basins/kashigeer/input/ksge/ksge.tsd.forc` declares 941
  forcing stations starting with X76.45Y38.05.csv, but the actual
  forcing/ directory carries only 403 CSV files in the X80.25–X84.05
  band (i.e. a different sub-basin slice). Running `./shud ksge`
  aborts immediately with `Reading fail, file = .../forcing/X76.45Y38.05.csv`
  at exit code 12 (FILEIO) — long before CVODE constructs, let alone
  the profile dump.

  Because no .dat is produced, no profile_B0.yaml can be produced
  either — the bucket timers never fire and shud_profile::dump() is
  never reached.
