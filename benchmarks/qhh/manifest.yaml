# benchmarks/qhh/manifest.yaml
# B-Medium, NWM qhh basin — local & server endpoints
# UNIQUE lake-path coverage (the only benchmark case with NumLake > 0).
# Field schema covers §S0.2 template + project extensions; see
# openspec/changes/s0-baseline-lock/specs/benchmark-registry/spec.md.
#
# IMPORTANT: this is the NWM-version qhh (386 stations, start 1979-01-01).
# Not to be confused with the SHUD upstream demo at SHUD/input/qhh
# (1-station forcing.csv, start 2002) — see CLAUDE.md.

project_name: "qhh"
description: "NWM qhh basin with one lake; sole NumLake>0 case (covers lake vertical/horizontal/DY paths)"

# --- OMP environment (S5d.4 #182; design D5 + master plan §S5d.4.3) ---
# Required deployment-layer thread-binding defaults. Wired via tools/run_omp.sh
# (the program does NOT override these env vars per design D5). CI schema gate:
# tools/check_manifest/check_omp_env.py + .github/workflows/serial-baseline.yml.
omp_env:
  OMP_PROC_BIND: close
  OMP_PLACES: cores

# --- Basin scale ---
NumEle: 4773
NumRiv: 1633
NumLake: 1
NumY: 15953            # = 3*4773 + 1633 + 1

# --- Input ---
input_dir: "SHUD/Basins/qhh/input/qhh/"
forcing_dir:                                      # M7 schema (PR-A #212): mapping of original + trimmed.
  original_path: "SHUD/Basins/qhh/forcing/"
  trimmed_path: "SHUD/Basins/qhh/forcing.trimmed/"
forcing_duration_days: 2557                       # spec-layer full length; trimmed_path window = M7 部署层 90d (see cfg_para_start/end)
# --- 90-day window deployment marker (M7 PR-B #213) ---
# cfg_para_{start,end} = cfg.para integer day-index after 90-day truncation.
# Forced exact-match against tools/forcing_trim/forcing_trim.sh resolved
# [start_day, end_day] per m7-forcing-trim spec L71-L74.
cfg_para_start: 8401
cfg_para_end:   8491
has_cryosphere: false                             # CRYOSPHERE=0 in cfg.para
has_lake: true                                    # qhh.lake.{sp,ic,bathy} present, 1 lake
has_BC_SS: false
dry_wet_transition: false                         # Qinghai Lake region

# --- Run ---
run_command: "cd SHUD/Basins/qhh && ../../shud qhh"
threads: 1
expected_walltime_sec: null                       # TODO measured @ S0.8

# --- RHS snapshot probe ---
snapshot_probe:
  t_values: [86400, 2592000, 7776000]             # 1 d / 30 d / 90 d (S1-pre re-archival; 90 d window per CLAUDE.md)
  Y_source: "cvode_state"
  arrays_to_dump:
    - "DY"
    - "QeleSurf"
    - "QeleSub"
    - "QrivSurf"
    - "QrivSub"
    - "flux_ET"

# --- Output bitwise comparison ---
output_compare:
  full_run_regression: true
  output_files:
    - "output/qhh.out/qhh.eleysurf.dat"
    - "output/qhh.out/qhh.eleyunsat.dat"
    - "output/qhh.out/qhh.eleygw.dat"
    - "output/qhh.out/qhh.eleysnow.dat"
    - "output/qhh.out/qhh.rivystage.dat"
    - "output/qhh.out/qhh.rivqdown.dat"
    - "output/qhh.out/qhh.lakystage.dat"          # has_lake=true → lake outputs present
    - "output/qhh.out/qhh.lakqrivin.dat"
    - "output/qhh.out/qhh.lakqrivout.dat"
  cvode_stats_file: "output/qhh.out/cvode_stats.txt"
  water_balance_file: "output/qhh.out/qhh.flood.csv"

# --- Project extensions ---
endpoint: "local-and-server"
derived_from: null
refine_factor: null
