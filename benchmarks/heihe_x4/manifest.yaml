# benchmarks/heihe_x4/manifest.yaml
# B-Large benchmark — heihe basin 4× refined via AutoSHUD pipeline — SERVER-ONLY
#
# Derived from heihe by re-running NWM/AutoSHUD pipeline (Step1-3) with
# NumCells=25340 (4× heihe baseline 6335) on heihe boundary + ASTER GDEM mosaic
# (36 tiles N37-N42 × E097-E102). Calibration NOT a goal: benchmark scope is
# mesh-topology + scale-test load for OpenMP work; hydrology calibration is a
# follow-up research task per user direction.
#
# Per CLAUDE.md and master plan §S0.12 this case is server-only:
# forcing dataset is CMFD V0200 (CMFD2.0, 0.1°), input is generated server-side
# and rsync'd to local minus forcing. CMFD V0106 (CMFD1.0) is DEPRECATED — its
# 16-station NE-corner NA gap (Juyan Lake region) crashes Step2 plotting; V0200
# fully covers the basin (see openspec/changes/s0-baseline-lock/design.md §D7.1).
#
# Field schema covers §S0.2 template + project extensions (endpoint, derived_from,
# refine_factor) + S0-5 generation lineage (rshud_call, source_dem, generated_*).

project_name: "heihe_x4"
description: "B-Large heihe basin 4× refined via AutoSHUD pipeline (rSHUD v2.5.0); OpenMP scale-test target"

# --- Basin scale --- (from AutoSHUD output sp.mesh/sp.riv on server, 2026-06-17)
NumEle: 40046
NumRiv: 4257
NumLake: 0
NumY: 124395                       # = 3*40046 + 4257 + 0

# --- Input ---
input_dir: "SHUD/Basins/heihe_x4/input/heihe_x4/"   # local rsync target; server source under SHUD-OpenMP repo
forcing_dir: "<server-data-root>/heihe_x4/forcing/"  # placeholder; server-only, generated by AutoSHUD Step2
forcing_duration_days: 1095                          # cfg ENDDAY=1095 (2003-2005, calibration-period window per heihe README)
has_cryosphere: true                                 # CRYOSPHERE=1 inherited from heihe (Qilian glacier+snowmelt domain)
has_lake: false
has_BC_SS: false
dry_wet_transition: true                             # arid inland Hexi basin (inherited from heihe)

# --- Run ---
run_command: "cd SHUD/Basins/heihe_x4 && ../../shud heihe_x4"
threads: 1
expected_walltime_sec: null                          # TODO measured @ S0.8 on server (B-Large scale ~10-100×heihe baseline)

# --- RHS snapshot probe ---
snapshot_probe:
  t_values: [86400, 864000, 8640000]                 # 1 d / 10 d / 100 d
  Y_source: "cvode_state"
  arrays_to_dump:
    - "DY"
    - "QeleSurf"
    - "QeleSub"
    - "QrivSurf"
    - "QrivSub"
    - "flux_ET"

# --- Output bitwise comparison ---
output_compare:
  full_run_regression: true
  output_files:
    - "output/heihe_x4.out/heihe_x4.eleysurf.dat"
    - "output/heihe_x4.out/heihe_x4.eleyunsat.dat"
    - "output/heihe_x4.out/heihe_x4.eleygw.dat"
    - "output/heihe_x4.out/heihe_x4.eleysnow.dat"
    - "output/heihe_x4.out/heihe_x4.rivystage.dat"
    - "output/heihe_x4.out/heihe_x4.rivqdown.dat"
  cvode_stats_file: "output/heihe_x4.out/cvode_stats.txt"
  water_balance_file: "output/heihe_x4.out/heihe_x4.flood.csv"

# --- Project extensions ---
endpoint: "server-only"
derived_from: "heihe"
refine_factor: 4

# --- S0-5 generation lineage (per tasks.md 5.3) ---
generation:
  pipeline: "AutoSHUD (NWM/AutoSHUD v2.5.0 tag = master HEAD `32bf6b4`, with local glob-anchor patch); rSHUD v2.5.0 master `2b7742e`"
  pipeline_patch: "tools/mesh_refine/autoshud_v2.5.0_cmfd2_glob_anchor.patch  (root-cause fix for CMFD2.0 glob collision when data extends past 2020)"
  driver_config: "tools/mesh_refine/heihe_x4.autoshud.txt"
  driver_script: "tools/mesh_refine/run_heihe_x4.sh"
  dem_source: "ASTER GDEM v3 mosaic (36 tiles, N37-N42 × E097-E102) built by tools/mesh_refine/build_dem_mosaic.sh"
  forcing_source: "CMFD V0200 / CMFD2.0 0.1° (<server-data-root>/ForcingData/CMFD2.0/Data_forcing_03hr_010deg/{LRad,Prec,Pres,RHum,SHum,SRad,Temp,Wind}/)"
  soil_source: "HWSD raster (<server-data-root>/SpatialData/World/Soil/HWSD)"
  landuse_source: "USGS LCI (<server-data-root>/SpatialData/World/Landuse/USGS_LCI)"
  boundary_source: "heihe gis/domain.shp (reused; geometry fully shared with parent)"
  river_source: "heihe gis/river.shp (reused; AutoSHUD re-derives sp.riv for refined mesh)"
  refinement_method: "NumCells parameter in AutoSHUD; a.max = min(AA1/NumCells, AreaMax) with NumCells=25340 (4× heihe baseline). Actual NumEle=40046 > 25340 because triangle q=30/MinAngle=30 constraints + boundary buffer increase density beyond a.max bound."
  generated_on: "2026-06-17"
  generated_by: "<user>@<target-deployment-server>"   # placeholder per CLAUDE.md
