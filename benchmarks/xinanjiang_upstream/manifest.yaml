# benchmarks/xinanjiang_upstream/manifest.yaml
# B-Small backup, NWM xinanjiang upstream — local & server endpoints
# Sits just below OMP_CUTOFF=1024 threshold (NumEle=801).
# Field schema covers §S0.2 template + project extensions; see
# openspec/changes/s0-baseline-lock/specs/benchmark-registry/spec.md.

project_name: "xinanjiang"
description: "NWM xinanjiang upstream basin; Small backup, OMP_CUTOFF=1024 boundary case"

# --- OMP environment (S5d.4 #182; design D5 + master plan §S5d.4.3) ---
# Required deployment-layer thread-binding defaults. Wired via tools/run_omp.sh
# (the program does NOT override these env vars per design D5). CI schema gate:
# tools/check_manifest/check_omp_env.py + .github/workflows/serial-baseline.yml.
omp_env:
  OMP_PROC_BIND: close
  OMP_PLACES: cores

# --- Basin scale ---
NumEle: 801
NumRiv: 216
NumLake: 0
NumY: 2619             # = 3*801 + 216 + 0

# --- Input ---
input_dir: "SHUD/Basins/xinanjiang_upstream/input/xinanjiang/"
forcing_dir:                                      # M7 schema (PR-A #212): mapping of original + trimmed.
  original_path: "SHUD/Basins/xinanjiang_upstream/forcing/"
  trimmed_path: "SHUD/Basins/xinanjiang_upstream/forcing.trimmed/"
forcing_duration_days: 4747                       # spec-layer full length; trimmed_path window = M7 部署层 90d (see cfg_para_start/end)
# --- 90-day window deployment marker (M7 PR-B #213) ---
# cfg_para_{start,end} = cfg.para integer day-index after 90-day truncation.
# Forced exact-match against tools/forcing_trim/forcing_trim.sh resolved
# [start_day, end_day] per m7-forcing-trim spec L71-L74.
cfg_para_start: 0
cfg_para_end:   90
has_cryosphere: true                              # CRYOSPHERE=1 in cfg.para (mountain headwater)
has_lake: false
has_BC_SS: false
dry_wet_transition: false                         # humid sub-tropical basin

# --- Run ---
run_command: "cd SHUD/Basins/xinanjiang_upstream && ../../shud xinanjiang"
threads: 1
expected_walltime_sec: null                       # TODO measured @ S0.8

# --- RHS snapshot probe ---
snapshot_probe:
  t_values: [86400, 2592000, 7776000]             # 1 d / 30 d / 90 d (S1-pre re-archival; 90 d window per CLAUDE.md)
  Y_source: "cvode_state"
  arrays_to_dump:
    - "DY"
    - "QeleSurf"
    - "QeleSub"
    - "QrivSurf"
    - "QrivSub"
    - "flux_ET"

# --- Output bitwise comparison ---
output_compare:
  full_run_regression: true
  output_files:
    - "output/xinanjiang.out/xinanjiang.eleysurf.dat"
    - "output/xinanjiang.out/xinanjiang.eleyunsat.dat"
    - "output/xinanjiang.out/xinanjiang.eleygw.dat"
    - "output/xinanjiang.out/xinanjiang.eleysnow.dat"
    - "output/xinanjiang.out/xinanjiang.rivystage.dat"
    - "output/xinanjiang.out/xinanjiang.rivqdown.dat"
  cvode_stats_file: "output/xinanjiang.out/cvode_stats.txt"
  water_balance_file: "output/xinanjiang.out/xinanjiang.flood.csv"

# --- Project extensions ---
endpoint: "local-and-server"
derived_from: null
refine_factor: null
