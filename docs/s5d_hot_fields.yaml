# docs/s5d_hot_fields.yaml — S5d.1 (#178) ElementHotData SoA field schema.
#
# Source-of-truth for the ElementHotData field set. Consumed by:
#   - SHUD/src/ModelData/MD_layout.hpp (struct declaration mirror)
#   - tools/check_manifest/check_hot_fields.py (CI grep gate)
#   - .github/workflows/serial-baseline.yml (Step "S5d.1 hot field grep gate")
#
# Schema: each entry = {name, type, size_per_ele, AoS_source_field}
#   - name: ElementHotData member name (with `_flat` suffix for size_per_ele=3)
#   - type: int | double
#   - size_per_ele: 1 (per-element scalar) | 3 (per-element 3-vec, stored flat as NumEle*3)
#   - AoS_source_field: full _Element member name (with class qualifier if inherited)
#
# Bitwise contract: yaml ↔ MD_layout.hpp ↔ Model_Data::initialize_hot() ↔
# RHS 3 files all reference the same names. CI grep gate enforces alignment.
#
# Audit method: the field set is the union of all `Ele[<expr>].<field>`
# accesses in MD_ElementFlux.cpp / MD_f.cpp / MD_ET.cpp (RHS hot path TUs),
# excluding the four _Element MEMBER METHODS (Flux_Infiltration,
# Flux_Recharge, updateElement, updateLakeElement) which dispatch on the
# AoS and are followed by sync_hot_dynamic(i) to refresh the dynamic
# u_* subset. Reproduce via:
#   grep -nE 'Ele\[[^]]+\]\.' SHUD/src/ModelData/MD_{ElementFlux,f,ET}.cpp \
#     | grep -oE 'Ele\[[^]]+\]\.[A-Za-z_0-9]+(\[[^]]+\])?' | sort -u
#
# Spec: openspec/changes/b1b-baseline-completion/specs/s5d-data-layout-soa-numa/spec.md
# Master plan: §4.22.1 lines 619-646; §S5d.1 lines 1385-1395.

hot_fields:
  # Geometry (Triangle parent)
  - {name: nabr,        type: int,    size_per_ele: 3, AoS_source_field: Triangle::nabr}
  - {name: lakenabr,    type: int,    size_per_ele: 3, AoS_source_field: Triangle::lakenabr}
  - {name: edge,        type: double, size_per_ele: 3, AoS_source_field: Triangle::edge}
  - {name: area,        type: double, size_per_ele: 1, AoS_source_field: Triangle::area}
  - {name: z_bottom,    type: double, size_per_ele: 1, AoS_source_field: Triangle::z_bottom}
  - {name: z_surf,      type: double, size_per_ele: 1, AoS_source_field: Triangle::z_surf}

  # Topology indices (AttriuteIndex parent — RHS-touched only)
  - {name: iSoil,       type: int,    size_per_ele: 1, AoS_source_field: AttriuteIndex::iSoil}
  - {name: iLC,         type: int,    size_per_ele: 1, AoS_source_field: AttriuteIndex::iLC}
  - {name: iMF,         type: int,    size_per_ele: 1, AoS_source_field: AttriuteIndex::iMF}
  - {name: iForc,       type: int,    size_per_ele: 1, AoS_source_field: AttriuteIndex::iForc}
  - {name: iLake,       type: int,    size_per_ele: 1, AoS_source_field: AttriuteIndex::iLake}
  - {name: iBC,         type: int,    size_per_ele: 1, AoS_source_field: AttriuteIndex::iBC}
  - {name: iSS,         type: int,    size_per_ele: 1, AoS_source_field: AttriuteIndex::iSS}

  # _Element direct fields
  - {name: Dist2Nabor,  type: double, size_per_ele: 3, AoS_source_field: _Element::Dist2Nabor}
  - {name: Dist2Edge,   type: double, size_per_ele: 3, AoS_source_field: Triangle::Dist2Edge}
  - {name: avgRough,    type: double, size_per_ele: 3, AoS_source_field: _Element::avgRough}
  - {name: FixPressure, type: double, size_per_ele: 1, AoS_source_field: _Element::FixPressure}
  - {name: WetlandLevel,type: double, size_per_ele: 1, AoS_source_field: _Element::WetlandLevel}
  - {name: RootReachLevel, type: double, size_per_ele: 1, AoS_source_field: _Element::RootReachLevel}
  - {name: depression,  type: double, size_per_ele: 1, AoS_source_field: _Element::depression}
  - {name: QBC,         type: double, size_per_ele: 1, AoS_source_field: _Element::QBC}
  - {name: QSS,         type: double, size_per_ele: 1, AoS_source_field: _Element::QSS}
  - {name: windH,       type: double, size_per_ele: 1, AoS_source_field: _Element::windH}
  - {name: u_qi,        type: double, size_per_ele: 1, AoS_source_field: _Element::u_qi}
  - {name: u_qex,       type: double, size_per_ele: 1, AoS_source_field: _Element::u_qex}
  - {name: u_effKH,     type: double, size_per_ele: 1, AoS_source_field: _Element::u_effKH}
  - {name: u_satn,      type: double, size_per_ele: 1, AoS_source_field: _Element::u_satn}

  # Soil_Layer parent (RHS-touched only)
  - {name: Sy,          type: double, size_per_ele: 1, AoS_source_field: Geol_Layer::Sy}

  # Landcover parent (RHS-touched only)
  - {name: VegFrac,     type: double, size_per_ele: 1, AoS_source_field: Landcover::VegFrac}
  - {name: Albedo,      type: double, size_per_ele: 1, AoS_source_field: Landcover::Albedo}
  - {name: Rough,       type: double, size_per_ele: 1, AoS_source_field: Landcover::Rough}
  - {name: ImpAF,       type: double, size_per_ele: 1, AoS_source_field: Landcover::ImpAF}

# Documentation: _Element fields explicitly NOT extracted (init/IO/calib
# only — no Ele[<expr>].<field> hit in the three RHS hot-path TUs).
non_hot_fields_in_Element:
  # Triangle parent — not RHS-touched
  - node              # init geometry
  - nabrToMe          # init topology, not read in hot path
  - slope             # geometry init-only
  - x                 # centroid; geometry init-only
  - y                 # centroid; geometry init-only
  - zcentroid         # geometry init-only
  # AttriuteIndex parent — not RHS-touched
  - iGeol             # geol calib indexer
  - IC                # IC selector, init-only
  - ilakebank         # lake-bank tag, init-only
  # _Element direct — not RHS-touched
  - index             # AoS index, init-only
  - RivID             # river linkage, init-only
  - RivSegID          # segment linkage, init-only
  - AquiferDepth      # u_deficit derivative; set in Flux_Infiltration via AoS
  - MacporeLevel      # init-only
  - yBC               # not RHS-read
  - iupdGW            # init-only flag
  - iupdSF            # init-only flag
  - u_qr              # written by Flux_Recharge but not RHS-read after
  - u_wf              # not RHS-read
  - u_deficit         # private; not RHS-read
  - u_theta           # private; not RHS-read
  - u_phius           # private; not RHS-read
  - u_Ginfi           # private; not RHS-read
  - u_satKr           # private; not RHS-read
  - u_effkInfi        # private; not RHS-read
  - Kmax              # private; not RHS-read
  # Soil_Layer parent — Soil[idx].* indexed lookup, not Ele[i].<field>
  - infKsatV
  - ThetaS
  - ThetaR
  - ThetaFC
  - Alpha
  - Beta
  - hAreaF
  - macKsatV
  - infD
  # Geol_Layer parent — Geol[idx].* indexed, not Ele[i].<field>
  - KsatH
  - KsatV
  - geo_ThetaS
  - geo_ThetaR
  - geo_vAreaF
  - macKsatH
  - macD
  # Landcover parent — not RHS-read
  - RzD
  - SoilDgrd
