# =============================================================================
# topology_manifest.yaml — SHUD-OpenMP B1a S4 PR-10 (openMP issue #154)
# =============================================================================
# Spec:
#   - openspec/changes/b1a-finalization/specs/s4-adjacency-topology/spec.md
#   - openspec/changes/b1a-finalization/design.md D9 (manifest YAML)
#   - SHUD_openMP_master_plan.md §5 L1283-1320 (S4.1-S4.7 + assert + fallback)
#
# Purpose: document the 7 B1a deterministic-gather adjacency lists declared
# in SHUD/src/ModelData/MD_adjacency.hpp + built by build_adjacency_lists()
# in MD_adjacency.cpp. Each list captures the B0 serial loop iteration
# order so PR-11 (S3c) can drive rhs_deterministic_gather() without
# perturbing floating-point accumulation order.
#
# Asserts: 3 entity types (RivSeg / Riv / Ele) × 7 benchmark cases = 21 rows.
#   Status legend:
#     pass                    — index == array_index + 1 holds for all i
#     fail                    — assert violated; build falls back to array-
#                               index ordering (still correct); add
#                               fallback_note describing the offending entity
#     N/A (deferred-upstream) — kashigeer (deferred per S0-13 spec amendment)
#     pending (PR-12 capstone)— heihe / heihe_x4 (server-only; verified during
#                               PR-12 server capstone)
#
# CI: .github/workflows/serial-baseline.yml runs `uv run python -c` schema
#     validation on this file every job; required fields per
#     adjacency_lists entry: name / purpose / sort_rule / b0_source /
#     iter_pattern; per asserts entry: entity / case / rule / result
#     (+ optional fallback_note).
# =============================================================================

# ----------------------------------------------------------------------------
# 7 adjacency lists (S4.1 – S4.7)
# ----------------------------------------------------------------------------
adjacency_lists:
  - name: seg_by_riv
    purpose: per-river segment indices for PassValue-style gather (QrivSurf / QrivSub)
    sort_rule: B0 iseg array index ascending
    b0_source: SHUD/src/ModelData/MD_f.cpp:170-171 (legacy) == PassValue() L214-221 (post-PR-9)
    iter_pattern: "for k in seg_by_riv[ir]"

  - name: seg_by_ele
    purpose: per-element segment indices for PassValue-style gather (Qe2r_Surf / Qe2r_Sub)
    sort_rule: B0 iseg array index ascending
    b0_source: SHUD/src/ModelData/MD_f.cpp:172-173 (legacy) == PassValue() L214-221 (post-PR-9)
    iter_pattern: "for k in seg_by_ele[ie]"

  - name: upstream_by_down
    purpose: per-downstream-river upstream river indices for QrivUp gather
    sort_rule: B0 iriv array index ascending
    b0_source: SHUD/src/ModelData/MD_f.cpp:177 (legacy) == PassValue() L222-226 (post-PR-9, uses iDownStrm macro = Riv[i].down - 1)
    iter_pattern: "for k in upstream_by_down[ir]"

  - name: riv_in_by_lake
    purpose: per-lake river-inflow indices for QLakeRivIn gather
    sort_rule: B0 iriv array index ascending
    b0_source: SHUD/src/ModelData/MD_RiverFlux.cpp:24 (legacy Flux_RiverDown) == PassValue() L237-241 (post-PR-9)
    iter_pattern: "for k in riv_in_by_lake[ilake]"

  - name: ele_by_lake
    purpose: per-lake lake-interior element indices for qLakeEvap / qLakePrcp gather
    sort_rule: B0 iele array index ascending
    b0_source: SHUD/src/ModelData/MD_f.cpp:15-16 (legacy) == MD_rhs_core.cpp::rhs_flux L160-161 + L210-213 (post-PR-9)
    iter_pattern: "for k in ele_by_lake[ilake]"

  - name: lake_bank_edge_by_lake
    purpose: per-lake bank-edge (element-index, edge-j) pairs for QLakeSurf / QLakeSub gather
    sort_rule: B0 iele ascending, j inner 0,1,2
    b0_source: SHUD/src/ModelData/MD_f.cpp fun_Ele_surface/sub lake branches (legacy) == PassValue() L251-258 + L264-271 (post-PR-9)
    iter_pattern: "for (ie, j) in lake_bank_edge_by_lake[ilake]"

  - name: edge_by_ele
    purpose: per-element 3-neighbor lateral flux indices for QeleSurf / QeleSub aggregate
    sort_rule: fixed j = 0, 1, 2
    b0_source: SHUD/src/ModelData/MD_f.cpp f_applyDY 3-neighbor loop (legacy) == MD_rhs_core.cpp::rhs_apply L279-284 (post-PR-9)
    iter_pattern: "for j in 0..2: inabr = edge_by_ele[ie][j]"

# ----------------------------------------------------------------------------
# 21 assert rows (3 entity types × 7 cases)
# ----------------------------------------------------------------------------
# Mac local cases (keliya / xinanjiang_upstream / qinyijiang / qhh):
#   verified by SHUD_ADJACENCY_LOG=1 env-var probe in MD_adjacency.cpp
#   (init-time stderr emit; bitwise-neutral). Output line schema:
#     [SHUD_ADJACENCY] NumSegmt=N1 NumRiv=N2 NumEle=N3 NumLake=N4
#     rivseg_pass=X riv_pass=Y ele_pass=Z fallback=W
#   Mac-validated runs (PR-10 implementer verification 2026-06-20):
#     keliya              — rivseg=1 riv=1 ele=1 fallback=0  (PASS)
#     xinanjiang_upstream — rivseg=1 riv=1 ele=1 fallback=0  (PASS)
#     qinyijiang          — rivseg=1 riv=1 ele=1 fallback=0  (PASS, verified during run)
#     qhh                 — rivseg=1 riv=1 ele=1 fallback=0  (PASS, verified during run)
# kashigeer: deferred-upstream per S0-13 spec amendment; 3 entries N/A.
# heihe / heihe_x4: server-only (forcing data not on Mac); 6 entries pending
#   PR-12 server capstone (will re-emit SHUD_ADJACENCY_LOG=1 in archive
#   workflow).
asserts:
  # --- keliya (Mac local, lake-disabled) ---------------------------------
  - { entity: RivSeg, case: keliya, rule: "index == i + 1 for all i in [0, NumSegmt)", result: pass }
  - { entity: Riv,    case: keliya, rule: "index == i + 1 for all i in [0, NumRiv)",   result: pass }
  - { entity: Ele,    case: keliya, rule: "index == i + 1 for all i in [0, NumEle)",   result: pass }

  # --- xinanjiang_upstream (Mac local, lake-disabled) --------------------
  - { entity: RivSeg, case: xinanjiang_upstream, rule: "index == i + 1 for all i in [0, NumSegmt)", result: pass }
  - { entity: Riv,    case: xinanjiang_upstream, rule: "index == i + 1 for all i in [0, NumRiv)",   result: pass }
  - { entity: Ele,    case: xinanjiang_upstream, rule: "index == i + 1 for all i in [0, NumEle)",   result: pass }

  # --- qinyijiang (Mac local, lake-disabled) -----------------------------
  - { entity: RivSeg, case: qinyijiang, rule: "index == i + 1 for all i in [0, NumSegmt)", result: pass }
  - { entity: Riv,    case: qinyijiang, rule: "index == i + 1 for all i in [0, NumRiv)",   result: pass }
  - { entity: Ele,    case: qinyijiang, rule: "index == i + 1 for all i in [0, NumEle)",   result: pass }

  # --- qhh (Mac local, lake-enabled, 1 lake) -----------------------------
  - { entity: RivSeg, case: qhh, rule: "index == i + 1 for all i in [0, NumSegmt)", result: pass }
  - { entity: Riv,    case: qhh, rule: "index == i + 1 for all i in [0, NumRiv)",   result: pass }
  - { entity: Ele,    case: qhh, rule: "index == i + 1 for all i in [0, NumEle)",   result: pass }

  # --- kashigeer (deferred-upstream per S0-13 spec amendment) ------------
  - { entity: RivSeg, case: kashigeer, rule: "index == i + 1 for all i in [0, NumSegmt)", result: "N/A (deferred-upstream)" }
  - { entity: Riv,    case: kashigeer, rule: "index == i + 1 for all i in [0, NumRiv)",   result: "N/A (deferred-upstream)" }
  - { entity: Ele,    case: kashigeer, rule: "index == i + 1 for all i in [0, NumEle)",   result: "N/A (deferred-upstream)" }

  # --- heihe (server-only; forcing data not on Mac) ----------------------
  - { entity: RivSeg, case: heihe, rule: "index == i + 1 for all i in [0, NumSegmt)", result: "pending (PR-12 capstone)" }
  - { entity: Riv,    case: heihe, rule: "index == i + 1 for all i in [0, NumRiv)",   result: "pending (PR-12 capstone)" }
  - { entity: Ele,    case: heihe, rule: "index == i + 1 for all i in [0, NumEle)",   result: "pending (PR-12 capstone)" }

  # --- heihe_x4 (server-only; 4x mesh refinement of heihe) ---------------
  - { entity: RivSeg, case: heihe_x4, rule: "index == i + 1 for all i in [0, NumSegmt)", result: "pending (PR-12 capstone)" }
  - { entity: Riv,    case: heihe_x4, rule: "index == i + 1 for all i in [0, NumRiv)",   result: "pending (PR-12 capstone)" }
  - { entity: Ele,    case: heihe_x4, rule: "index == i + 1 for all i in [0, NumEle)",   result: "pending (PR-12 capstone)" }
