# =============================================================================
# S5b — lake reset 顺序 audit (qhh trace, #177 / B1b PR-2)
# =============================================================================
# Spec:
#   - openspec/changes/b1b-baseline-completion/tasks.md task 3.4
#
# Purpose: prove that, in the only Mac benchmark case with `lakeon=1`
# (qhh), every per-lake accumulator is zero-reset BEFORE any element-loop
# iteration writes (or += accumulates) into it within a single RHS call.
# This is the precondition for future thread-parallel element loops in
# S5c / A3a — without it, a previous CVODE iteration's lake values could
# leak into the next iteration's gather.
#
# Method: trace MD_rhs_core.cpp from `rhs_core` entry (Serial branch)
# through `rhs_update` -> `rhs_flux` -> `rhs_deterministic_gather` ->
# `rhs_apply`. For each per-lake array, record (a) reset_site (first
# zero-write in source/execution order), (b) element_loop_first_write
# (first per-element `+=` or scratch-slot write that contributes to the
# lake aggregate), (c) verify reset_site executes strictly BEFORE
# element_loop_first_write in the single-threaded driver.
#
# All trace lines are in `SHUD/src/Model/MD_rhs_core.cpp`.
# =============================================================================
s5b_lake_reset_order:
  call_chain:
    - SHUD/src/Model/f.cpp:54                  # f() -> MD->rhs_core(Y, DY, t, ExecPolicy::Serial)
    - SHUD/src/Model/MD_rhs_core.cpp:42-132    # rhs_core::Serial branch -> rhs_update (per-cell zero-reset pass)
    - SHUD/src/Model/MD_rhs_core.cpp:167-261   # rhs_flux (element + segment + river + lake gather passes)
    - SHUD/src/Model/MD_rhs_core.cpp:296-374   # rhs_deterministic_gather (segment->river/element + lake aggregates)
    - SHUD/src/Model/MD_rhs_core.cpp:400-509   # rhs_apply (DY assembly)

  lake_accumulators:
    - name: QLakeSurf
      reset_sites:
        - SHUD/src/Model/MD_rhs_core.cpp:120   # rhs_update: QLakeSurf[i] = 0.
        - SHUD/src/Model/MD_rhs_core.cpp:351   # rhs_deterministic_gather: QLakeSurf[ilake] = 0. (defensive re-zero)
      element_loop_first_write: SHUD/src/Model/MD_rhs_core.cpp:357  # gather: QLakeSurf[ilake] += QeleSurf_lake[ie*3+j]
      verdict: "PASS — reset_site (rhs_update L120) executes BEFORE rhs_flux element loop; rhs_deterministic_gather's own reset L351 also precedes its own += L357; the element-loop write at MD_ElementFlux.cpp:57 targets per-element scratch QeleSurf_lake (NOT QLakeSurf), so element loop NEVER racy-writes to QLakeSurf"

    - name: QLakeSub
      reset_sites:
        - SHUD/src/Model/MD_rhs_core.cpp:119   # rhs_update: QLakeSub[i] = 0.
        - SHUD/src/Model/MD_rhs_core.cpp:364   # rhs_deterministic_gather: defensive re-zero
      element_loop_first_write: SHUD/src/Model/MD_rhs_core.cpp:370  # gather: QLakeSub[ilake] += QeleSub_lake[ie*3+j]
      verdict: "PASS — same pattern as QLakeSurf"

    - name: QLakeRivIn
      reset_sites:
        - SHUD/src/Model/MD_rhs_core.cpp:123   # rhs_update: QLakeRivIn[i] = 0.
        - SHUD/src/Model/MD_rhs_core.cpp:339   # rhs_deterministic_gather: defensive re-zero
      element_loop_first_write: SHUD/src/Model/MD_rhs_core.cpp:343  # gather: QLakeRivIn[ilake] += QrivDown[iriv]
      verdict: "PASS — driven by per-river-down values populated in Flux_RiverDown (rhs_flux L206-208); ascending iriv via S4 riv_in_by_lake list"

    - name: QLakeRivOut
      reset_sites:
        - SHUD/src/Model/MD_rhs_core.cpp:124   # rhs_update: QLakeRivOut[i] = 0.
      element_loop_first_write: N/A (no element-loop write; only consumed by rhs_apply DY assembly L494)
      verdict: "PASS — currently zero-reset only; future lake-outflow features will need to add an explicit pre-write reset (S6b scope)"

    - name: qLakeEvap
      reset_sites:
        - SHUD/src/Model/MD_rhs_core.cpp:121   # rhs_update: qLakeEvap[i] = 0.
        - SHUD/src/Model/MD_rhs_core.cpp:216   # rhs_flux pre-gather defensive reset (in lakeon branch, before element-loop accumulation)
      element_loop_first_write: SHUD/src/Model/MD_rhs_core.cpp:222  # rhs_flux gather: qLakeEvap[ilake] += qEleEvapo_lake[i]
      verdict: "PASS — TWO resets bracket the element-loop write: rhs_update L121 (defensive at RHS entry), rhs_flux L216 (mandatory pre-gather), then L222 += accumulation. The lake clamp at L228 reads the gathered values; reset L216 ensures the clamp doesn't see stale data from a previous CVODE iteration"

